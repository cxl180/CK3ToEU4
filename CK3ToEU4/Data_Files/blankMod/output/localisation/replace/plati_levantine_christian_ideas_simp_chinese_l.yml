 levantine_christian_cultural_ideas_bonus: "黎凡特基督教决心"
 levantine_birthplace_of_christianity: "基督教的诞生地"
 levantine_birthplace_of_christianity_desc: "安提阿，坐落于古代叙利亚的奥龙特斯河畔，作为基督教最早的核心之一，具有深远的历史意义。正是在安提阿，耶稣基督的追随者首次被称为“基督徒”，标志着这一信仰身份和传播的重要时刻。这座繁华的国际化城市不仅孕育了早期的基督教社区，也成为了传教士远征的战略基地，推动了耶稣教义在整个地中海世界的传播。"
 levantine_crusades: "十字军"
 levantine_crusades_desc: "随着数次十字军的胜利，拉丁基督教对中东的影响愈发深入。带来了长期的西方主导地位。这一时期见证了文化和宗教的重大变革，拉丁基督教机构扎根，改变了伊斯兰扩张和随后势力崛起的轨迹。"
 levantine_restoration_of_holy_land: "圣地恢复"
 levantine_restoration_of_holy_land_desc: "在十字军取得胜利后，他们在中东的统治促进了农业和基础设施的显著发展，这些发展受到了拉丁基督教实践的影响。西方的农业方法和灌溉系统被引入，促进了经济增长，并通过欧洲建筑影响逐渐重塑了该地区的城市和城镇面貌。"
 levantine_pacify_the_tribes: "安抚部落"
 levantine_pacify_the_tribes_desc: "在十字军取得完全胜利后，封建领主在中东建立了要塞和庄园，与阿拉伯部落领袖进行复杂的谈判、联盟和偶尔的冲突。这种互动塑造了独特的文化交融和持续的领土与资源紧张关系，拉丁基督教影响逐渐渗透到当地的阿拉伯习俗和治理结构中。"
