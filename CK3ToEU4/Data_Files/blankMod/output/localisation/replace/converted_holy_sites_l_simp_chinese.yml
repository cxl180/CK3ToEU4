l_simp_chinese:
 HOLY_SITE_410_DESC:0 "公元1世纪，基督教由使徒多马、圣马代（埃德萨的达陡）及其门徒阿盖与马利传入伊拉克。多马与达陡同属十二使徒之列。"
 HOLY_SITE_535_DESC:0 "已知科钦犹太人在公元1世纪便已居住于喀拉拉。当时，一位讲阿拉米语的犹太人——例如来自加利利的圣多马——前往喀拉拉是可行的。目前已知最早将这位使徒与印度联系起来的文献是《多马行传》，约成书于3世纪初，可能写于埃德萨。"
 HOLY_SITE_445_DESC:0 "公元6世纪（553年）至11世纪间，木鹿是东叙利亚都主教省的所在地，在聂斯托里派教会沿丝绸之路东传至突厥斯坦与中国的使命中居于关键地位。1221年，该城向入侵的蒙古大军敞开城门；随之而来的毁城之祸极为惨烈。据史籍记载，全城居民（含难民）共百万人尽遭屠戮。"
 HOLY_SITE_2308_DESC:0 "早在197年，埃德萨便已举行过基督教会议。232年，相传为使徒多马的遗物被交予埃德萨教会一事而写成了《叙利亚文行传》。在罗马统治下，埃德萨有许多殉道者受难：德西乌斯治下的圣沙尔比勒与圣巴尔萨米亚，戴克里先治下的圣古尔贾、圣沙莫纳、哈比布等人。来自埃德萨的基督教司铎向美索不达米亚东部与波斯传教，并在萨珊王朝境内建立了最早的教会。埃德萨主教阿提拉提亚曾出席第一次尼西亚大公会议（325年）。"
 HOLY_SITE_700_DESC:0 "西安碑（又称大秦景教碑）表明，由于传教士阿罗本于635年的努力，东方教会得到了唐太宗皇帝的认可。据碑文所载，阿罗本及其同行的叙利亚教士于太宗九年（635年）自大秦（东罗马帝国）来华，携来经书与圣像。该碑于845年——大约在灭佛期间——被埋入地下，直至1625年才重见天日。"
 