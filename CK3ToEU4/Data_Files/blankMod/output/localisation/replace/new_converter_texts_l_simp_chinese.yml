 # Deities desc
 ukko_desc:0 "乌戈是芬兰多神教中最重要的神。他是雷神，也是天界的统治者。"
 tapio_desc:0 "塔皮奥是狩猎之神，也是森林的统治者。"
 ahti_desc:0 "阿赫蒂是水域的统治者，也是渔猎之神。"
 mielikki_desc:0 "米耶利基是森林与狩猎女神。"
 akras_desc:0 "埃克拉丝是农业与丰饶之神。"
 tuoni_desc:0 "图奥尼是死神，也是冥界的统治者。"
 perun_desc:0 "佩伦是雷神，也是斯拉夫万神殿中的至高神。"
 jarilo_desc:0 "雅里洛是春天、丰饶与草木之神。"
 lada_desc:0 "拉达是和谐、爱与美之女神。"
 veles_desc:0 "维列斯是大地、水域与冥界之神。"
 svarog_desc:0 "斯瓦罗格是火之神，有时也被描述为锻造之神。"
 svetovid_desc:0 "四首的斯韦托维德是战争、丰饶与富足之神。"
 perkunas_desc:0 "佩尔库纳斯是雷电与天空之神，也是迪瓦斯之子。"
 ausrine_desc:0 "奥什里内是晨星女神。她常与美与青春相关联。"
 saule_desc:0 "绍莱是太阳女神。她常与生命、丰饶与健康相关联。"
 laima_desc:0 "莱玛是运气与命运女神。她与生育、婚姻和死亡相关联。"
 gabija_desc:0 "加比娅是火之女神。她也是家园与家庭的守护者。"
 dievas_desc:0 "迪瓦斯是波罗的神话中的至高神。"
 tiwaz_desc:0 "提瓦兹是战争之神，也是早期日耳曼万神殿的首神。"
 wodan_desc:0 "沃丹（或称沃达纳兹）是诗人、先知与魔法之神。他也与狩猎、战争和带来胜利相关联。"
 dunar_desc:0 "图纳尔（或称图纳拉兹）是雷电与天空之神。"
 frijjo_desc:0 "弗丽约是爱之女神，也是沃丹的妻子。"
 austro_desc:0 "奥斯特罗是黎明与春日之女神。"
 fraujaz_desc:0 "弗劳亚兹是丰饶与繁荣之神。"
 amun_desc:0 "阿蒙是埃及万神殿之王，也是风之神。"
 maat_desc:0 "玛阿特是真理、平衡、秩序与正义之女神。玛阿特确保埃及的稳固。"
 ra_desc:0 "拉是太阳之神，与隼或鹰相关联。"
 seth_desc:0 "赛特是失序、暴力、混沌与风暴之神。"
 isis_desc:0 "伊西斯是理想的母亲与妻子，既是亡者的守护者，也是儿童之女神。"
 anubis_desc:0 "阿努比斯是豺首之神，与木乃伊制作及来世相关联。"