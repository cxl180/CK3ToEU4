 ##Fetishist Cults
 west_african_pagan_reformed_cult:3 "长老制"
 west_african_pagan_reformed_cult_desc:3 "我们遵循族人的道路，他们向我们揭示了宇宙中更宏大的真理，我们也因此变得更强。"
 tengri_cult:3 "腾格里"
 tengri_cult_desc:3 "我们信奉腾格里——天空之主、诸神之首。在他的指引下，我们精通了骑术。"
 baltic_cult:3 "罗穆瓦"
 baltic_cult_desc:3 "我们是佩尔库纳斯的守护者。为了迪瓦斯、佩尔库纳斯与我们人民的荣耀，我们坚定而不退。蒙其庇佑，我们永不疲惫，永不失败。"
 finnish_cult:3 "苏奥门乌斯科"
 finnish_cult_desc:3 "我们敬奉本乡的动物，并以合宜的仪式与典礼取悦它们的先祖之母——埃穆们。"
 slavic_cult:3 "罗德诺维里"
 slavic_cult_desc:3 "我们信奉三层世界之树。我们向自上方守望此树的佩伦、达日博格、莫科什与拉达献上供品。我们也谨记不可忽视维列斯——他支撑着世界之树的结构，并看顾亡者。"
 zunist_cult:3 "祖恩信仰"
 zunist_cult_desc:3 "我们遵循立法者祖恩的教诲，他平等而公正地审判众生。在祖恩眼中，没有什么比公正、公平与仁慈更崇高。我们的人民努力践行这些理想，而当领袖未能达到祖恩的期望时，他们须承担责任。"
 bon_cult:3 "苯教"
 bon_cult_desc:3 "我们献身于祈祷、勤勉与虔诚，以求转世并成就经、续与大手印。我们的居所已蒙诸神护佑，我们也在家中为他们设立神座。"
 hellenic_cult:3 "希腊"
 hellenic_cult_desc:3 "我们敬奉奥林匹斯诸神，并致力于成为人中之杰。"
 pagan_cult:3 "帕肯"
 pagan_cult_desc:3 "我们接纳了那些信仰与我们不同的人，采纳他们的习俗，并向他们的神献祭。我们因此只是变得更强。"
 gnostic_cult:3 "诺斯提克"
 gnostic_cult_desc:3 "我们认识到物质世界是造物主所统治的虚假而可怖的造物。我们期盼从物质世界中获得救赎。"
 yazidi_cult:3 "雅兹迪"
 yazidi_cult_desc:3 "我们敬奉孔雀天使麦勒克·陶斯——七天使之首、亚当的同伴、亚伯拉罕的拯救者、神所选定的统治者。借着他，我们与全能者同得救赎。"
 illyric_snake_cult:0 "蛇"
 illyric_snake_cult_desc:0 "南伊利里亚人历来信奉蛇崇拜。尊奉此崇拜，我国必将蒙受更高的丰饶之赐。"
 illyric_sun_cult:0 "太阳"
 illyric_sun_cult_desc:0 "北伊利里亚人历来信奉太阳崇拜。接纳太阳崇拜，必定能激发连我们最不虔诚的臣民也心生虔敬。"
 illyric_horseman_cult:0 "骑手"
 illyric_horseman_cult_desc:0 "与色雷斯人的接触为我们带来了色雷斯骑手崇拜——他是一位伟大的猎手，其骑术之精湛堪称传奇。尊奉他的崇拜，必定能激励我们自己的骑手。"
 canaanite_cult:0 "塔尼特"
 canaanite_cult_desc:0 "我们信奉塔尼特女神，她的庇佑将为我们的作物带来雨水，在战斗中保护我们的战士，并确保我们的妇女多子。"
 kemetism_cult:0 "拉"
 kemetism_cult_desc:0 "我们的统治者是太阳神拉的直接代表。只要毫无置疑地追随并服从我们的统治者，我们就是在执行拉的圣意，确保他的庇佑降临于我们的人民。"
 druidic_cult:0 "德鲁伊"
 druidic_cult_desc:0 "我们遵循德鲁伊的神秘教诲，他们的律法维系秩序，并为我们国家赢得诸神的眷顾。"
 ajivika_cult:0 "阿吉维卡"
 ajivika_cult_desc:0 "我们已接纳「尼耶蒂」——即生命早已注定、命中注定的信念。我们所崇拜的神、我们所行的善恶之举，都无法改变未来，也无法影响我们最终的命运，因为根本不存在自由意志。"

 ##Personal Deities
 #Khurmazta
 ZZZ_enhanced_desi:3 "德西"
 ZZZ_enhanced_desi_desc:3 "德西是丰饶女神。以她的神像作为礼拜之物十分普遍，以她之名献祭亦然。"
 ZZZ_enhanced_parn:3 "帕恩"
 ZZZ_enhanced_parn_desc:3 "帕恩是好运与王室荣耀之神。"
 ZZZ_enhanced_nanaiya:3 "娜娜伊娅"
 ZZZ_enhanced_nanaiya_desc:3 "感官之娜娜伊娅是四臂的爱与欢愉女神。"
 ZZZ_enhanced_weshparkar:3 "韦什帕卡尔"
 ZZZ_enhanced_weshparkar_desc:3 "韦什帕卡尔是风之神。"
 ZZZ_enhanced_wishaghn:3 "维沙恩"
 ZZZ_enhanced_wishaghn_desc:3 "维沙恩是胜利之神。"
 ZZZ_enhanced_zurvan:3 "祖尔万"
 ZZZ_enhanced_zurvan_desc:3 "祖尔万是知识之神，也是诸神之王。"

 #Triggered Mods
 ZZZ_enhanced_unreformed_religion:3 "未改革的多神教"
 desc_ZZZ_enhanced_unreformed_religion:3 "该国信奉未改革的多神教。在成功改革信仰之前，其传教难度更高。"
 fraticelli_rome:3 "占领罗马"
 desc_fraticelli_rome:3 "以小兄弟派身份占领罗马，只会激起普遍的愤怒。"
 fraticelli_subjugation:3 "征服教宗"
 desc_fraticelli_subjugation:3 "我们已征服教宗国的土地。这损害了我们在其他小兄弟派信众眼中的声望。"


 #Country Mods
 west_african_pagan_reformed_migration_into_ZZZ:3 "改革之举"
 desc_west_african_pagan_reformed_migration_into_ZZZ:3 "社会中的某些势力希望在我们的社会中推行变革，无论宗教上还是行政上。"
 ZZZ_baltic_pagan_migration_into_africa:3 "罗穆瓦移民"
 desc_ZZZ_baltic_pagan_migration_into_africa:3 "大量罗穆瓦信众迁入本省。为表感谢，他们不辞辛劳地加强了 [Root.GetName] 的防务。"
 ZZZ_enhanced_poachers:3 "失控的盗猎者"
 desc_ZZZ_enhanced_poachers:3 "[Root.GetName] 境内，只为取乐而猎杀的盗猎者与猎手猖獗。这导致黑市扩张，民众也因政府似乎无所作为而群情激愤。"
 ZZZ_enhanced_animal_boom:3 "野兽数量激增"
 desc_ZZZ_enhanced_animal_boom:3 "[Root.GetName] 的野兽数量急剧增长，提供了充足的食物与畜产。"
 ZZZ_finnish_pagan_migration_into_africa:3 "苏奥门乌斯科移民"
 desc_ZZZ_finnish_pagan_migration_into_africa:3 "大量苏奥门乌斯科信众迁入本省。他们承诺为我国辛勤劳作，以表谢意。"
 ZZZ_slavic_pagan_migration_into_africa:3 "斯拉夫移民"
 desc_ZZZ_slavic_pagan_migration_into_africa:3 "大量斯拉夫信众迁入本省。他们组建了地方民兵，数量惊人的青年加入了军队；若传言可信，还有少数女性也尝试入伍！"
 ZZZ_tengri_pagan_migration_into_africa:3 "腾格里移民"
 desc_ZZZ_tengri_pagan_migration_into_africa:3 "大量腾格里信众迁入本省。他们的骑兵已证明是国家的绝佳资产。"
 ZZZ_zunist_pagan_migration_into_africa:3 "祖恩信徒移民"
 desc_ZZZ_zunist_pagan_migration_into_africa:3 "大量祖恩信众迁入本省。他们承诺誓死协助保卫 [Root.GetName]。"
 ZZZ_enhanced_mighty_temple_being_built:3 "宏伟神庙兴建中"
 desc_ZZZ_enhanced_mighty_temple_being_built:3 "一座献给诸神的宏伟神庙正在 [Root.GetCapitalName] 内兴建。"
 ZZZ_hellenic_pagan_migration_into_africa:3 "希腊移民"
 desc_ZZZ_hellenic_pagan_migration_into_africa:3 "大量希腊信众迁入本省。他们承诺协助更好地治理 [Root.GetName]。"
 ZZZ_bon_pagan_migration_into_africa:3 "苯教移民"
 desc_ZZZ_bon_pagan_migration_into_africa:3 "大量苯教信众迁入本省。他们承诺辛勤劳作、不生事端。"
 ZZZ_spreading_of_reformed_pagan_rituals:3 "$RELIGION$仪式"
 desc_ZZZ_spreading_of_reformed_pagan_rituals_title:3 "该国已开始认真协力地在民众中传播 $RELIGION$ 仪式。"


 #Triggered Province Mods
 ZZZ_enhanced_mighty_temple:3 "宏伟神庙"
 desc_ZZZ_enhanced_mighty_temple:3 "这里矗立着一座献给诸神的宏伟神庙，可与万神殿或帕特农神庙相媲美。"
 ZZZ_enhanced_zoro_mecca:3 "征服麦加"
 desc_ZZZ_enhanced_zoro_mecca:3 "我们曾被穆斯林入侵者逐出故土。我们的古老神庙遭到亵渎，琐罗亚斯德的永恒之火被扑灭，但如今我们已复仇。伊斯兰圣城 [Root.GetCapitalName] 已在我们的掌控之下。"
 ZZZ_enhanced_hellenic_rome:3 "收复罗马"
 desc_ZZZ_enhanced_hellenic_rome:3 "很久以前，基督教异教徒几乎将我们逼至灭绝的边缘，但我们坚持了下来，并在诸神的助力下重夺罗马，为帝国的覆亡报了仇。"

 #Province Mods
 ZZZ_defend_the_motherland_baltic_cult:3 "捍卫传统"
 desc_ZZZ_defend_the_motherland_baltic_cult:3 "作为迪瓦斯与佩尔库纳斯的信徒，我们有义务坚定地捍卫我们的土地与生活方式。"
 ZZZ_enhanced_pet_lion:3 "宠物狮"
 desc_ZZZ_enhanced_pet_lion:3 "王室养着一头宠物狮，是亲手搏斗制服的。"
 ZZZ_enhanced_good_horses:3 "良马"
 desc_ZZZ_enhanced_good_horses:3 "这个国家的马匹品质异常优良。莫非是受了神恩加持？"
 ZZZ_enhanced_poor_horses:3 "劣马"
 desc_ZZZ_enhanced_poor_horses:3 "这个国家的马匹品质实在太差，只能推测是某位神明对该国有所不满。"
 ZZZ_enhanced_white_stallion:3 "[ZZZ_enhanced_white_stallion_name]"
 desc_ZZZ_enhanced_white_stallion:3 "[Root.GetName] 的王室拥有一匹神骏的白马，名为 [ZZZ_enhanced_white_stallion_name]，疾如风，猛如狮。除王室成员外，他不许任何人骑乘。"
 string_ZZZ_shadowfax:3 "影疾"
 string_ZZZ_atrax:3 "阿特拉克斯"
 string_ZZZ_bree:3 "布里"
 string_ZZZ_unnamed:3 "白马"
 ZZZ_tengri_pagan_migration_into_africa2:3 "腾格里移民骑兵"
 desc_ZZZ_tengri_pagan_migration_into_africa2:3 "腾格里移民骑兵已投入我们的麾下。他们带来了高超的骑术与新的军事技术。"
 ZZZ_bad_omens:3 "凶兆"
 desc_ZZZ_bad_omens:3 "关于即将到来的冲突，该国得到了不祥的征兆。"
 ZZZ_good_omens:3 "吉兆"
 desc_ZZZ_good_omens:3 "关于即将到来的冲突，该国得到了吉祥的征兆。"
 ZZZ_great_omens:3 "大吉兆"
 desc_ZZZ_great_omens:3 "关于即将到来的冲突，该国得到了极为吉祥的征兆。"
 ZZZ_incredible_omens:3 "不可思议的征兆"
 desc_ZZZ_increedible_omens:3 "该国得到的征兆昭示：所有即将到来的冲突都将获胜。"

