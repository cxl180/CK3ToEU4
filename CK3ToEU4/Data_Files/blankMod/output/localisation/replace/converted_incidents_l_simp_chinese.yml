l_simp_chinese:
 incident_fraticelli_pope:3 "教宗与皇帝"
 incident_fraticelli_pope_member_alert:3 "随着意大利再度成为帝国权威的堡垒，罗马教宗已请求成为神圣罗马帝国的帝国诸侯。教宗若接受皇帝的权威，将对小兄弟派世界产生严重后果。帝国境内的小兄弟派信众或许会因教宗身份所赋予的正当性而信念更坚，但帝国之外的信众恐怕难以接受这一决定，甚至可能转向异端。"
 incident_fraticelli_pope_emperor_alert:3 "随着意大利再度成为帝国权威的堡垒，罗马教宗已请求成为神圣罗马帝国的帝国诸侯。教宗若接受皇帝的权威，将对小兄弟派世界产生严重后果。帝国境内的小兄弟派信众或许会因教宗身份所赋予的正当性而信念更坚，但帝国之外的信众恐怕难以接受这一决定，甚至可能转向异端。"

 #The following overwrites the original. It replaces direct references to True Christians so that it works for other popes
 incident_pope.1.t:3 "神圣帝国？"
 incident_pope.1.d:3 "意大利已不再是'影之国'，在皇帝的不懈努力下重归神圣罗马帝国的怀抱。教宗国如今必须抉择：是接受皇帝的霸权，还是被弃置于帝国门槛之上，赤裸而脆弱。\n\n接受皇帝的权威将对基督教世界产生严重后果。帝国境内的真基督徒或许会因教宗身份所赋予的正当性而信念更坚，但帝国之外的信众恐怕难以接受这一决定，甚至可能转向异端。"
 incident_pope.1.a:3 "我们将加入帝国。"
 incident_pope.1.b:3 "圣座必须保持独立。"
 pope_incident_tt:3 "皇帝将决定是否接纳教宗国加入神圣罗马帝国。\n§Y这将对整个基督教世界产生影响。§!"
 pope_incident_tt2:3 "§Y这将对整个基督教世界产生影响。§!\n§Y帝国之外的真基督徒将受到威望惩罚。§!"
 incident_pope.2.t:3 "神圣帝国？"
 incident_pope.2.d:3 "意大利已不再是'影之国'，在皇帝的不懈努力下重归神圣罗马帝国的怀抱。罗马教宗已选择接受帝国的霸权，而非被弃置于帝国门槛之上，赤裸而脆弱。\n\n允许教宗成为帝国诸侯将对基督教世界产生严重后果。帝国境内的真基督徒或许会因教宗身份所赋予的正当性而信念更坚，但帝国之外的信众恐怕难以接受这一决定，甚至可能转向异端。"
 incident_pope.2.a:3 "教宗将加入帝国"
 incident_pope.2.b:3 "圣座应当保持独立。"
 incident_pope.3.t:3 "亵渎的帝国"
 incident_pope.3.d:3 "帝国议会已通过一道可怕而不可容忍的敕令：帝国将不再信奉真基督教。我们为恢复圣母教会尊严所做的一切努力都已付诸东流，因此我们必须认真考虑弃绝这一已被玷污的体制。"
 incident_pope.3.a:3 "让我们离开这罪恶之窟。"
 incident_pope.3.b:3 "为了基督教世界的利益，我们必须留下。"
