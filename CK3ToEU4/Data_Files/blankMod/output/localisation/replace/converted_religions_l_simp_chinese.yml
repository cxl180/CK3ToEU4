 # Descs
 germanic_pagan_religion_desc:0 "作为北欧与中欧日耳曼诸民族的本土宗教，日耳曼异教涵盖多种信仰，彼此存在重要的地域差异。其核心共通主题包括仪式献祭、握有权势的女祭司，以及严格的名誉准则。"
 anglo_pagan_religion_desc:0 "盎格鲁-撒克逊异教是一套多神信仰体系，核心是对称为"埃塞"的诸神的信仰。其中最显赫的当属沃登；其他重要的神包括图诺尔与提乌。此外人们还相信有各种超自然存在栖居于大地之间，包括精灵、尼克（水妖）与龙。"
 cybelene_religion_desc:0 "弗里吉亚的库柏勒崇拜与史前的母神崇拜相关联。历经数千年演变，库柏勒崇拜常宣称与神话人物及英雄有所关联，并以膜拜神像的方式来实践其宗教。"
 zamolxism_religion_desc:0 "扎尔莫克西斯最初究竟是先知还是神祇，已无从得知。然而达契亚人与盖塔人将扎尔莫克西斯尊为神明，并把许多奇迹归之于他。"
 mithraism_religion_desc:0 "虽然受伊朗人对琐罗亚斯德教神祇密特拉的崇拜所启发，但希腊的密特拉斯却与一套崭新而独特的图像体系相关联，在罗马帝国军队中颇为流行。其信众拥有由七级入教仪式构成的复杂体系，以及共同举行的礼仪聚餐。"
 arab_pagan_religion_desc:0 "阿拉伯的宗教是神祇、化身与精灵的多神混合体，在各地以地方性与聚居性的形式践行。在这一时期，某些地方或许曾将创世神安拉作为神系之首来崇拜。"
 armenian_pagan_religion_desc:0 "哈尔迪神系所代表的宗教，是许多世纪以前从乌拉尔图文化中发展而来的。它主要是一种多神信仰，其主神名为哈尔迪，被作为战神加以崇拜。"
 caucasian_pagan_religion_desc:0 "高加索-伊比利亚地区的神系或许与邻近的安纳托利亚诸宗教有所关联，其神系统辖于神祇阿尔马兹之下。"
 iberian_pagan_religion_desc:0 "伊比利亚宗教实践本质上是一种混合型多神教，包含对动物精灵的崇敬以及祖先崇拜。伊比利亚人崇拜各种希腊与腓尼基神祇，也崇拜贝塔通或阿塔埃西娜等地方神祇。"
 scythian_pagan_religion_desc:0 "这一泛神信仰源于斯基泰之地，崇拜七位主神，常被等同于希腊神系中的诸神。斯基泰人更早的多神民间宗教元素依然留存，马祭与车葬的习俗亦然——与凯尔特人的做法相似。"
 briton_pagan_religion_desc:0 "不列颠的凯尔特人崇拜自然万物。他们总体上是随和而爱好和平的民族，但一旦被逼，战斗中便可凶猛异常，往往除却身上繁复的文身之外全身赤裸地作战。"
 gallic_pagan_religion_desc:0 "高卢人是西欧与中欧一个自豪而强大的民族。与不列颠群岛的邻人颇为相似，他们从自然中寻得宁静，并崇拜自然界中的万物。"
 gaelic_pagan_religion_desc:0 "盖尔人信奉与邻人凯尔特人相似的神系。盖尔人崇拜自然界中的万物，德鲁伊与吟游诗人在盖尔文化中备受尊崇。"
 celtiberian_pagan_religion_desc:0 "伊比利亚的凯尔特部族是一个神秘的人群，其事迹大多已湮没于历史。从仅有的少量记载来看，他们在文化上与高卢人极为相似，并信奉相似的神系。"
 atenism_religion_desc:0 "与多神的凯麦特教不同，阿顿信仰是一种一神教，只崇拜太阳圆盘阿顿。与凯麦特教不同，阿顿信徒否认其他神祇的存在，并将对他们的崇拜直接定为罪行。"
