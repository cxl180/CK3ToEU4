 # More Bookmarks Plus
 barghawata:0 "巴尔加瓦塔"
 barghawata_religion_desc:0 "一种经大幅改动并柏柏尔化的伊斯兰教形式，混合了传统柏柏尔神话，由自称马赫迪与先知的萨利赫·伊本·塔里夫创立。"