 #Descriptions
 arianism_religion_desc:0 "阿里乌斯派是基督教中否定三位一体的一支，主张耶稣基督是上帝之子，由圣父所造，与圣父有别，因而从属于圣父。阿里乌斯的教导最初归于阿里乌斯之名，并在325年第一次尼西亚大公会议上被定为异端。"
 pagan_religion_religion_desc:3 "自有历史以来，欧洲与中东便是无数与亚伯拉罕诸教无关的异教信仰与教派的居所。"
 bon_religion_desc:3 "苯教是西藏古老的、佛教传入之前的本土宗教。它在本质上是萨满教与万物有灵论，信奉多位神祇。佛教传入西藏后，苯教吸收了许多佛教元素。"
 west_african_pagan_religion_desc:3 "西非宗教涵盖了撒哈拉以南非洲各部族众多不同的异教信仰。祖先崇拜、万物有灵论与图腾萨满教占主导，但同时也有各种不同的神祇体系。"
 norse_pagan_religion_desc:3 "古老的日耳曼信仰体系拥有庞大的神祇体系，由智慧的战神奥丁（或称沃丹）统领，他统辖世界之树尤格德拉希尔的一切枝干。另外两位主神是对人类友善的托尔（图纳尔）与丰饶之神弗雷。"
 slavic_pagan_religion_desc:3 "斯拉夫异教信奉多神，主神为雷电之神佩伦。其他重要的神祇包括冥界之神维列斯，以及斯瓦罗格、雅里洛与斯万特维特。"
 baltic_pagan_religion_desc:3 "波罗的异教信奉多神，其神系由天空之神迪耶瓦斯统领。其他主神包括雷电之神佩尔库纳斯、太阳与丰饶女神绍莱，以及道加瓦与梅内斯。"
 finnish_pagan_religion_desc:3 "芬兰异教形式多样，各部族与各地区之间差异很大。它崇敬众多神祇，包括乌戈／佩尔凯莱、库乌，以及东部的土地女神马斯托尔-阿瓦。"
 tengri_pagan_religion_desc:3 "腾格里信仰是欧亚草原诸民族的宗教，尤其是突厥与蒙古游牧民。主神为腾格里——统辖天空的创世之神。"
 zun_pagan_religion_desc:3 "祖恩——正义的赐予者——是最初由阿富汗祖恩比尔王朝所崇拜的太阳神。祖恩体现智慧、力量、火焰以及驱散黑夜的光明。"
 pagan_religion_religion_desc:3 "自有历史以来，欧洲与中东便是无数与亚伯拉罕诸教无关的异教信仰与教派的居所。"
 aztec_pagan_religion_desc:3 "阿兹特克宗教的创世神话以献祭为核心——连神明也曾被献祭，以维持太阳的运行。这反映在该宗教众多的节庆与仪式中，其中包含大规模的活人献祭。主要神祇包括：战争与活人献祭之神维齐洛波奇特利、雷电与雨之神特拉洛克、火之神修特库特利、"我们的剥皮之主"西佩·托特克，以及智慧之神魁札尔科亚特尔。"
 west_african_pagan_reformed_religion_desc:3 "改革西非宗教融合了许多民间信仰，拥有一部统一的圣书，其中包含创世神话、关于精灵的篇章、图腾动物寓言以及诸神。"
 baltic_pagan_reformed_religion_desc:3 "改革波罗的信仰拥有一部圣书，内含创世神话、关于诸神的篇章以及一部预言书。该教会还拥有标准化的礼仪，以及由迪耶瓦斯最高祭司领导的正式教阶体系。"
 finnish_pagan_reformed_religion_desc:3 "改革芬兰信仰拥有一部圣书，内含创世神话、关于诸神的篇章以及一部咒法与秘仪之书。该教会还拥有标准化的礼仪，以及由乌戈最高祭司领导的正式教阶体系。"
 slavic_pagan_reformed_religion_desc:3 "改革斯拉夫信仰拥有一部圣书，内含创世神话、关于诸神的篇章以及一部预言书。该教会还拥有标准化的礼仪，以及由佩伦最高祭司领导的正式教阶体系。"
 zun_pagan_reformed_religion_desc:3 "祖恩——太阳神与正义的赐予者——体现智慧、力量、火焰以及驱散黑夜的光明。改革祖恩信仰拥有一部圣书，详述创世神话等内容并阐明教会教义，此外还有标准化的礼仪，以及由最高祭司领导的正式教阶体系。"
 hellenic_pagan_religion_desc:3 "希腊多神教信奉多神，其神系包含十二位主神，其中有朱庇特、玛尔斯、墨丘利、维纳斯、密涅瓦与维斯塔。它起源于古希腊，并随着亚历山大大帝与罗马帝国的征服，进而成为地中海世界的主导宗教，直至基督教世界兴起。"
 hellenic_pagan_reformed_religion_desc:3 "希腊多神教信奉多神，其神系包含十二位主神，其中有朱庇特、玛尔斯、墨丘利、维纳斯、密涅瓦与维斯塔。它起源于古希腊，并随着亚历山大大帝与罗马帝国的征服，进而成为地中海世界的主导宗教，直至基督教世界兴起。"
 jain_religion_desc:3 "耆那教是极为古老的宗教，源出印度苦行的沙门传统，与祭司阶层的婆罗门及种姓制度相对立。耆那教的指导原则是"不害"——非暴力——其诠释比任何其他宗教都更为彻底。"
 cathar_religion_desc:3 "卡特里派（又称阿尔比派）异端拒绝告解，也否认神职人员与教宗的神圣性。他们只有一项圣事——"慰藉礼"——用以除罪，并使信徒成为卡特里派的"完人"。"
 fraticelli_religion_desc:3 "小兄弟派（意为"小兄弟们"）是源自方济各会修士的天主教异端。它致力于守贫与苦修——尤其要求神职人员如此。小兄弟派异端激烈反对教会的财富与奢靡排场。"
 waldensian_religion_desc:3 "瓦勒度派最初是天主教会内部的改革运动。瓦勒度派异端反对教权，主张回归守贫誓愿。他们反对死刑，并认为平信徒也可以施行圣事。"
 lollard_religion_desc:3 "罗拉德派异端反对天主教会中他们所见的腐败。与许多天主教异端一样，他们厌恶神职人员的财富与炫耀，主张回归更原始的基督教形式。"
 monophysite_religion_desc:3 "基督一性论是早期基督教异端，主张基督只有单一的神性。这与聂斯托里派的立场相反——后者认为基督具有两个彼此有别的本性：一为神性，一为人性。"
 bogomilist_religion_desc:3 "鲍格米勒派最初是带有诺斯替元素的东正教异端，它彻底否定教会教阶，主张回归早期基督教。鲍格米勒派相信世界是由邪恶的造物主——魔鬼——所创造的。"
 monothelite_religion_desc:3 "基督一志论是一种基督论学说，于681年被宣布为异端。一志论者试图在基督单一本性问题上发展合一性论与一性论的立场，主张基督兼具人性与神性，但只有一个意志。一志论教会名义上的首脑是安条克的一志论宗主教。"
 iconoclast_religion_desc:3 "圣像破坏运动这一异端曾多次冲击拜占庭帝国。圣像破坏者认为宗教图像——尤其是圣像与圣徒画像——属于偶像崇拜，绝不可容许。在其鼎盛时期，破坏者毁掉了无数此类装饰与圣像，有时甚至是在圣像破坏派皇帝的怂恿下为之。"
 paulician_religion_desc:3 "保罗派是受曼尼奇教影响的基督教诺斯替异端，起源于亚美尼亚。"
 nestorian_religion_desc:3 "聂斯托里派是早期基督教的一支，主张基督具有两个彼此有别的本性：一为神性，一为人性。这与一性论的立场相反——后者认为基督只有单一本性。聂斯托里派教会名义上的首脑是东方宗主教。"
 messalian_religion_desc:3 "麦萨利安派（又称"祈祷者"）是源自美索不达米亚的基督教异端教派，受琐罗亚斯德教等二元论信仰影响。麦萨利安派相信上帝可被肉身感官所感知，且此种感知是达到完满所必需的。每个人生来内中便有一个恶魔，唯有热切的祈祷才能将其驱除。他们还相信路西法是上帝的长子、是一股向善的力量，并认为乱伦是神圣的，因为亚当与夏娃的子女曾如此行。他们没有正式仪式，也没有严格的教会教阶。"
 zikri_religion_desc:3 "齐克里派是伊玛目阿赫尔·扎曼·哈兹拉特·赛义德·穆罕默德·乔恩普里（即马赫迪伊玛目）的追随者。"
 yazidi_religion_desc:3 "亚兹迪人相信上帝创造世界后委任七位天使掌管，其中为首者是孔雀天使麦勒克·陶斯，或称沙伊坦——基督徒与穆斯林通常将其等同于撒旦。"
 kharijite_religion_desc:3 "哈瓦利吉派是伊斯兰教的一支，在7世纪初便遭到边缘化与压制。他们认为任何不悔改的罪人都是卡菲尔，同时也否认哈里发无误的说法。"
 druze_religion_desc:3 "德鲁兹派源自什叶派伊斯兰教的伊斯玛仪派，但除亚伯拉罕诸教的特征外，还带有许多诺斯替主义与新柏拉图主义的色彩。"
 hurufi_religion_desc:3 "胡尔菲派是伊斯兰教内部一个神秘主义的、带有喀巴拉色彩的苏菲教派。"
 qarmatian_religion_desc:3 "卡尔马特派是什叶派伊斯兰教中的异端分支，融合了琐罗亚斯德教的元素。他们否认什叶派统治者的主流继承谱系，也否认朝觐。"
 samaritan_faith_religion_desc:3 "撒玛利亚信仰是与犹太教关系密切的亚伯拉罕宗教。撒玛利亚人主张，他们的崇拜才是巴比伦之囚之前古代以色列人的真正宗教，由留在以色列地的人保存下来；而犹太教在他们看来则是一种相关但已被改动与修订的宗教。"
 karaite_faith_religion_desc:3 "卡拉派犹太教是一场犹太运动，其特点是在犹太宗教律法与神学中只承认《塔纳赫》为最高律法权威。在这一点上，它有别于主流的拉比犹太教。卡拉派坚持认为，上帝传给摩西的一切神圣诫命都记载于成文《托拉》之中，并无额外的口传律法或解释。"
 khurmazta_religion_desc:3 "库尔姆扎塔（扎尔瓦纳）是流行于粟特人中的混合型琐罗亚斯德教。它将琐罗亚斯德教与印度教、佛教及各种异教混合在一起。除库尔姆扎塔之外，他们还崇拜风神韦什帕卡尔等次级神祇并献上供品，通常以小雕像的形式。"
 mazdaki_religion_desc:3 "马兹达克是一位琐罗亚斯德教祭司，自称是阿胡拉·马兹达的先知。他试图以诺斯替元素改革该教，并主张财产共有与福利措施。"
 manichean_religion_desc:3 "曼尼奇教是一种诺斯替宗教，融合了基督教、琐罗亚斯德教、佛教与诺斯替主义的元素。"

## From CK3
 #Christian
 adamites:0 "亚当派"
 adamites_religion_desc:0 "亚当派最初是罗马晚期北非的一个早期基督教教派，以试图通过赤身裸体、不为善恶负责来重现人间天堂而声名狼藉。"
 adoptianist:0 "嗣子论派" #Spelled with 'a' to distinguish from another group known as adoptionist
 adoptianist_religion_desc:0 "伊比利亚的嗣子论一支，其根源可追溯至托莱多大主教区及其周边教区中的独立思考、数世纪前北非的清教主义，以及9世纪初数位极具魅力的异端首领。尽管其形式多样，从极为隐晦到极其直白兼有，但共同的教义要点是对圣子永恒神性持质疑态度。"
 insular_celtic:0 "海岛"
 insular_celtic_religion_desc:0 "海岛凯尔特基督教与天主教略有差异，但差异之小，除却一个好听的名号之外，并不足以用游戏机制来表现。"
 bosnian_church:0 "克尔斯提亚尼"
 bosnian_church_religion_desc:0 "长久以来被天主教与东正教两方所遗忘，波斯尼亚高地的克尔斯提亚尼比他们更为知名的同信仰者更为宽容，却缺乏正式的组织结构。他们保留了许多古老的基督教元素，因而常被同信仰者轻蔑相待——倘若他们还被人记得的话。"

 #Islamic
 masmudi:0 "马斯穆迪"
 masmudi_religion_desc:0 "作为源自北非柏柏尔部族的伊斯兰教改革派分支，穆瓦希德运动自视为一神论者，宣扬一种纯化的一神教教义。"
 mutazila:0 "卡达里耶"
 mutazila_religion_desc:0 "一个理性主义的神学学派，主张《古兰经》并非与真主永恒共存，因为真主必然先于其言语而存在。"
 quranist:0 "唯经派"
 quranist_religion_desc:0 "对伊斯兰教的一种字面主义诠释，强调《古兰经》是神圣智慧的唯一来源，应逐字遵行，而无视圣训与教令。"
 alawite:0 "阿拉维派"
 alawite_religion_desc:0 "阿拉维派的宗教教导秘而不宣，《古兰经》只是其圣典之一。除相信伊玛目经由阿里传承之外，阿拉维派还相信转世，并相信一切众生本是从天界被逐出的星辰，如今必须通过一世又一世良善而虔诚的生活来重新赢回自己的位置。"
 



 #Yazidi
 yazidism: "亚兹迪教"
 harmonized_yazidism:0 "与亚兹迪诸信仰调和"
 desc_harmonized_yazidism:0 "我们已将一切亚兹迪信仰纳入我国与民族精神之中。"
 meshefaresism:0 "麦谢法雷斯派"
 meshefaresism_religion_desc:0 "麦谢法雷斯派是《黑书》的追随者，该书描述了主如何从黑山降临并创造世界。"
 kitebacilweism:0 "基特巴奇尔韦派"
 kitebacilweism_religion_desc:0 "基特巴奇尔韦派是《启示之书》的追随者，该书讲述胡达的伟大。"
 HOLY_SITE_411_DESC:0 "摩苏尔境内有拉利什——位于尼尼微的一处山谷与神庙。它是亚兹迪人最神圣的神庙，也是亚兹迪信仰的核心人物谢赫阿迪·伊本·穆萨菲尔陵墓的所在地。"
 HOLY_SITE_385_DESC:0 "麦加以伊斯兰教圣地而闻名。若亚兹迪信众能控制麦加，那将证明我们应当朝向拉利什祈祷，而非朝向麦加。"
 HOLY_SITE_379_DESC:0 "作为亚伯拉罕诸教之一，亚兹迪人视耶路撒冷为圣城，须以最高的敬意与谨慎对待。"
 HOLY_SITE_4326_DESC:0 "作为世界上最古老、最负盛名的城市之一，内沙布尔曾不止一次成为伟大帝国的都城，自其核心散发出威望与力量。"
 HOLY_SITE_430_DESC:0 "据称布什尔是三位博士的安葬之地，因而不仅在战略上重要，在神学上亦然。"

 #Mazdan
 zurvanism:0 "祖尔万主义"
 zurvanism_religion_desc:0 "祖尔万主义者相信，阿胡拉·马兹达与安格拉·曼纽是平等而对立的双生子，皆由万物的创造者祖尔万所生。祖尔万主义极力强调通过根除邪恶与虚妄来协助阿胡拉·马兹达。"
 gayomarthianism:0 "伽约马尔特派"
 gayomarthianism_religion_desc:0 "基于阿胡拉·马兹达因其思绪而意外造出恶灵这一观念，伽约马尔特派否认智慧之主的无误性，转而强调以仪式实践在与阿胡拉·马兹达的相通中领悟真理。"
 khurramism:0 "胡拉米耶派"
 khurramism_religion_desc:0 "在光明与黑暗并存的世界里，为支持良善，必须推翻不义的统治者。通过马兹达克、穆罕默德与阿布·穆斯林等先知，胡拉米耶派相信神性会降生于人间，并终有一日归来，以弥赛亚之姿引领他们。"

 #Gnostic
 gnostic: "诺斯替主义"
 gnostic_religion_desc: "诺斯替主义是各种不同宗教理论的集合，大多以二元论为核心，认为物质世界是邪恶的产物。"
 harmonized_gnostic:0 "与诺斯替诸信仰调和"
 desc_harmonized_gnostic:0 "我们已将一切诺斯替信仰纳入我国与民族精神之中。"
 mandeaism:0 "曼达教"
 mandeaism_religion_desc:0 "曼达教将其传承追溯至亚当，并以施洗约翰为其最伟大的先知。世界由光明与黑暗构成，终有一时，一切凡人的灵魂都将受审判，以定其是否配得回归永恒之光。"
 valentinianism:0 "瓦伦廷派"
 valentinianism_religion_desc:0 "圣父——最初的创造者——是一切知识的深渊，也是通往真正领悟——即"诺斯"——的道路。获得知识能改善世界；一旦世界集体摆脱其物质上的蒙昧，世界便将回归其属灵的、本然的状态。"
 sethianism:0 "塞特派"
 sethianism_religion_desc:0 "未知之神将一切存在流溢而出，汇入完美的"普累若麻"，其中充盈着恩典的诸移涌，居首者为"母-父"芭比洛。\n一次败坏导致了雅达巴奥特的出现，他窃取了一丝神性并创造了物质世界。然而，当他创造人类时，却无意间将自己窃得的神性火花赋予了人类。雅达巴奥特将穷尽永恒试图夺回其力量，而人类则必须努力使自身回归芭比洛与未知之神。"
 priscillianism:0 "普里西利安派"
 priscillianism_religion_desc:0 "存在着两个国度，一为光明，一为黑暗。人类灵魂本应征服黑暗之国，却堕落并被困于物质领域之中。人类中有十二位"光明族长"，因身心分裂而未能胜过黑暗。因此上帝将救主遣至人间，并借其死亡再度使人类灵魂得以解脱。"
 cainitism:0 "该隐派"
 cainitism_religion_desc:0 "该隐是造物主之恶的第一个受害者——造物主是一切物质之物的创造者。既然物质与肉体是邪恶的，肉体就必须通过罪孽加以玷污与毁灭，如此内中真正的人类灵魂才能获得解脱。"

 #Pagan
 kushitism_pagan:1 "库施信仰"
 kushitism_pagan_religion_desc:0 "此地崇奉古神之风依然浓厚，对生与死之界限的崇敬亦然。"
 kushitism_pagan_reformed:0 "改革库施"
 kushitism_pagan_reformed_religion_desc:0 "重振的库施信仰将其历史追溯数千年，直至古时的埃及帝国。"
 magyar_pagan:2 "乌拉尔"
 magyar_pagan_religion_desc:1 "在此信仰中，每一位"塔尔托什"（即祭司）都在出生之前便已由诸神选定。乌拉尔人相信这些塔尔托什具有超人的力量、智慧与神力，因而托付他们保护族群并引领其走向繁荣。"
 magyar_pagan_reformed:0 "改革乌拉尔"
 magyar_pagan_reformed_religion_desc:0 "改革乌拉尔教会因共同信仰而团结，其成员相信"塔尔托什"（即祭司）在出生之前便已由诸神选定。乌拉尔人相信这些塔尔托什具有超人的力量、智慧与神力，因而托付他们保护族群并引领其走向繁荣。"
 siberian_pagan:0 "图鲁姆信仰"
 siberian_pagan_religion_desc:0 "图鲁姆信徒相信一个横向的世界，人与兽皆以氏族为单位生活，通过结盟或复仇相互联结。狩猎是夺取生命与赋予生命之间平衡的核心环节；人死后，一切灵魂顺流而下，转生于其先前所属的氏族之中。"
 siberian_pagan_reformed:0 "改革图鲁姆信仰"
 siberian_pagan_reformed_religion_desc:0 "图鲁姆教会宣扬一个横向的世界，人与兽皆以氏族为单位生活，通过结盟或复仇相互联结。对图鲁姆信徒而言，生与死的平衡极为重要，浪费一次狩猎被视为大罪。他们相信人死后，一切灵魂顺流而下，转生于其先前所属的氏族之中。"

 #Eastern
 harmonized_confucian:0 "与儒家学说调和"
 desc_harmonized_confucian:0 "我们已将一切儒家理想纳入我国与民族精神之中。"
 harmonized_other_eastern:0 "与东方诸信仰调和"
 desc_harmonized_other_eastern:0 "我们已将一切东方信仰纳入我国与民族精神之中。"

 # From Imperator

 canaanite: "迦南"
 canaanite_religion_desc: "迦南宗教以多神教的方式崇敬众多神祇及其化身。巴力被视为一个由次级神祇构成的复杂神系中的主神，这些神祇常在山上或丘顶的神龛中受到崇拜。"
 druidism: "德鲁伊教"
 druidism_religion_desc: "德鲁伊在凯尔特人中是一个独特的社会阶层。他们常充任执法者与立法者，同时也支配着当地的宗教习俗与信仰。"
 kemetism: "凯麦特教"
 kemetism_religion_desc: "埃及本土宗教的历史可追溯数千年。它表现为一种多神信仰，对拉、阿图姆、塞赫美特等神祇的崇拜，展现出对自然界根本层面的深切敬畏。"
 mardukism: "马尔杜克教"
 mardukism_religion_desc: "迦勒底神系的历史可追溯数千年。迦勒底宗教的信徒崇拜安努、恩基与南纳等神祇，并为他们所尊奉的神建造宏伟的神庙。"
 ajivika: "阿吉维卡"
 nuragic_pagan: "努拉吉"
 nuragic_pagan_religion_desc:0 "努拉吉信仰可追溯至科西嘉与撒丁尼亚的青铜时代。其中充满对动物与井泉的崇拜，而努拉吉信仰最核心的部分，是对一位父神的单一主神式信仰，这位父神有诸多名号，包括萨尔多、西德·阿迪尔等。"
 hurrian_pagan: "胡里特"
 hurrian_pagan_religion_desc:0 "胡里特人崇拜众多源自古近东不同文化的神祇。胡里特神系中的主神是强大的天气之神特舒布及其妻子、母神赫巴特。胡里特人还崇敬一类特殊的人物，即所谓的"萨雷纳"——被神化的君王与英雄。"
 illyric_pagan: "伊利里亚"
 illyric_pagan_religion_desc:0 "伊利里亚诸民族信奉一个独特的伊利里亚神系，并受意大利与希腊神系影响。伊利里亚没有单一的首神，而是崇拜众多地方神祇。他们还有两个重要的崇拜：派奥尼亚伊利里亚人的太阳崇拜与南伊利里亚人的蛇崇拜。"
 hattian_pagan: "哈梯"
 hattian_pagan_religion_desc:0 "哈梯宗教是一种真正古老的信仰，其部分元素可追溯至数千年前的石器时代。哈梯信众与季节及大地本身的自然循环相协调：他们备办供品与奠酒献给母神，以使田地保持肥沃，并防止天灾倾覆这片土地。"
 
