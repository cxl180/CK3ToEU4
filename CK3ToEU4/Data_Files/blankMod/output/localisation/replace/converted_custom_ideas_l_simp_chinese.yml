l_simp_chinese:

 european_tribal_ideas:3 "欧洲部落理念"
 european_tribal_ideas_start:3 "欧洲部落传统"
 european_tribal_ideas_bonus:3 "欧洲部落雄心"
 deep_roots:3 "根深蒂固"
 deep_roots_desc:3 "自我们记忆所及，这片土地便属于我们。我们的先祖母与先祖父在这片土地上辛勤劳作、征战、死去。我们的根扎得很深，我们将以生命捍卫家园。"
 warriors_grit:3 "战士的坚毅"
 warriors_grit_desc:3 "其他国家或许在技术与财富上占优，但我们一名战士可抵他们十人。强壮、坚定、不屈——四方远近之人都听过他们坚毅的传闻。"
 the_way_of_old:3 "古道"
 the_way_of_old_desc:3 "关于祖先勇武的故事代代相传。无论是少年还是老练的战士，都能从这些故事中觅得智慧，并带着它们走上战场。"
 ruthless_raiders:3 "无情的劫掠者"
 ruthless_raiders_desc:3 "我们的气候严酷，土地贫瘠。但我们的斧头无比锋利，我们的人民也比大多数人都更勇敢。我们想要什么，便去夺取。胆敢挡路者，绝无宽恕。"
 ancestral_pride:3 "先祖之傲"
 ancestral_pride_desc:3 "作为一个民族，我们始终以过往为傲。历经歉收与漫长的战争，这份骄傲使我们的精神坚强而不动摇。"
 arctolatry:3 "熊崇拜"
 arctolatry_desc:3 "自远古以来，我们便奉行熊崇拜。我们的战士研习熊的搏斗方式，并将其凶猛带上战场。"
 side_by_side:3 "并肩而立"
 side_by_side_desc:3 "我们明白，力量不在人数，而在于我们之间的羁绊。在战场上我们无所畏惧，因为我们知道同袍会在背后守护我们。"
 hero_of_the_legends:3 "传说中的英雄"
 hero_of_the_legends_desc:3 "我们自幼便以母乳与古老传说为食。其中最著名的传说讲述一位强大的英雄，终有一日将引领我们的民族走向伟大。他的到来已近——我们能在血液中感受到。"

 jomsvikings_ideas:3 "约姆斯维京理念"
 jomsvikings_ideas_start:3 "约姆斯维京传统"
 jomsvikings_ideas_bonus:3 "约姆斯维京雄心"
 jomsviking_code:3 "约姆斯维京法典"
 jomsviking_code_desc:3 "约姆斯维京在决定接纳何人加入其团体时极为挑剔。成员资格仅限于已证明自身勇武的男子。为获准加入，有意者须以一项勇力之举证明自己。一旦成为成员，便受严格行为准则的约束，并须服从严酷的军纪。"
 legend_of_jomsborg:3 "约姆斯堡的传说"
 legend_of_jomsborg_desc:3 "长久以来，约姆斯堡一直是北欧同胞梦寐以求的传奇之地。一座固若金汤的堡垒，拥有可容纳数百艘战船的庞大舰队的受保护港湾。"
 glory_of_the_allfather:3 "为了众父之神的荣耀"
 glory_of_the_allfather_desc:3 "约姆斯维京致力于崇拜北欧战神奥丁。团体中的北欧人不畏死亡，他们最大的愿望便是在战场上死得其所。"
 name_of_thor:3 "以托尔之名"
 name_of_thor_desc:3 "托尔是守护与力量之神，也是该团体所崇拜的神。约姆斯堡的凶悍战士只要还能挥动斧头砸开十字架崇拜者的头颅，就会一直战斗下去。"
 adopt_feudal_system:3 "采行封建制"
 adopt_feudal_system_desc:3 "约姆斯维京最初是一个专事崇拜北欧诸神的团体，从来都不适合成为一个正规国家。如今战争领袖已推行改革，采行封建制，将采邑授予团体中最忠诚的成员，以酬其长久服役。"
 implement_hogting:3 "设立高等庭"
 implement_hogting_desc:3 ""庭"是一种地方集会，用以解决争端并作出政治决策。随着约姆斯维京壮大，他们在边远地区的影响力却日渐削弱。为继续掌控当地民众，他们将"庭"设为政府中的核心机构，由战争领袖担任宣法者。"
 valhalla_awaits:3 "英灵殿在等候"
 valhalla_awaits_desc:3 "作为阿萨神族的信徒，北欧人相信当诸神黄昏来临时，他们会被邀赴英灵殿的盛宴，再度在诸神身边作战。这使战争与战斗成为他们生活的核心，他们时刻为战场上那光荣的一天作准备。"

 hashshashin_ideas:3 "阿萨辛理念"
 hashshashin_ideas_start:3 "阿萨辛传统"
 hashshashin_ideas_bonus:3 "阿萨辛雄心"
 hashshashins_creed:3 "阿萨辛信条"
 hashshashins_creed_desc:3 "阿萨辛是中东一个隐秘的刺客团体。他们在人数上处于劣势，被政治与宗教上的敌人四面围困，因此成员精于暗杀与谍报等秘密行动。"
 avoid_bloodshed:3 "避免流血"
 avoid_bloodshed_desc:3 "阿萨辛倾向于在不必流血的情况下达成目标。若有可能，他们会通过刺杀关键目标来避免大规模杀戮。团体的敌人对此心知肚明，因而常被劝服先走外交途径。"
 ismailis_dar_al_hijra:3 "伊斯玛仪派的迁居之所"
 ismailis_dar_al_hijra_desc:3 "这些堡垒渐以同信仰者的避难所而闻名。整个地区的伊斯玛仪派都逃向该团体，以寻求保护与安全。"
 mountain_fortresses:  "山地堡垒"
 mountain_fortresses_desc:3 "阿萨辛著名的堡垒隐藏于群山之中，极难围攻。即便有外力征服了该省，阿萨辛仍盘踞于堡垒之中，在幕后维持着控制。"
 dagger_and_a_note:3 "一柄匕首与一张字条"
 dagger_and_a_note_desc:3 "该团体进行外交的常见方式，是让目标明白：若不作明智的选择，便可能受到伤害。流行的一种做法是在夜里以留下一柄匕首与一张字条来吓唬敌方将领，并确保目标恰在刺客离开前醒来。这便让将领明白，该团体同样可以轻易地除掉这个麻烦制造者。"
 murder_in_the_open:3 "当众行刺"
 murder_in_the_open_desc:3 "恐惧是阿萨辛极为乐用的工具。他们以关键目标为棋子，借此控制敌人当地的民众，确保他们不敢反抗。最容易做到这一点的办法，就是在集市之类的公共场所行刺。"
 revive_jihad_hassan:3 "复兴哈桑的圣战"
 revive_jihad_hassan_desc:3 "阿萨辛的创立者哈桑·萨巴赫相信他们正从事一场圣战，是同胞的守护者。我们应当复兴这一信念，让年轻人涌向我们的军队，为捍卫伊斯兰而战。"

 knights_templar_ideas:3 "圣殿骑士理念"
 knights_templar_ideas_start:3 "圣殿骑士传统"
 knights_templar_ideas_bonus:3 "圣殿骑士雄心"
 latin_rule:3 "拉丁守则"
 latin_rule_desc:3 "《拉丁守则》是一部包含72项条款的文献，规定了圣殿骑士的理想行为。其内容涵盖从斋戒等宗教层面，直至该团体的着装规范。"
 letters_of_credit:3 "信用票据"
 letters_of_credit_desc:3 "朝圣者的旅途确实极为艰苦，拦路强盗与匪徒正觊觎那些无力自卫的基督徒的财物。本团体的职责是守护朝圣者，办法之一便是替朝圣者保管财物，并回赠一张信用票据。这会大大降低他们在路上被盯上的可能。"
 assault_troops_of_the_crusades:3 "十字军突击部队"
 assault_troops_of_the_crusades_desc:3 "本团体的骑士始终处于十字军的最前线，率先冲锋杀入敌阵。曾有一场传奇战役，500名圣殿骑士击破了萨拉丁两万六千人大军的阵线。"
 bank_of_europe:3 "欧洲的银行"
 bank_of_europe_desc:3 "我们庞大的财富使我们成为欧洲大多数王室的债主。我们真是欧洲的银行！"
 the_templar_enterprise:3 "圣殿骑士的产业"
 the_templar_enterprise_desc:3 "本团体在欧洲与中东均拥有土地与庄园。我们生产羊毛、布匹、葡萄酒与食物，供世人享用。如今无论走到哪里，都很难不碰到'圣殿领地制造'的东西。各种关于我们主宰世界之类的玩笑也开始流传开来。"
 the_supporting_infrastructure:3 "支撑性的基础体系"
 the_supporting_infrastructure_desc:3 "它起初或许只是个军事团体，但为支撑军事阶层而聚敛的巨额财富，已使我们亟需一套支撑性的基础体系来管理我们的财库。"
 crusader_traditions:3 "十字军传统"
 crusader_traditions_desc:3 "本团体有着参与历次十字军东征的悠久传统，这为我们积累了大量见过战争恐怖的老兵。他们仍愿效劳，因此我们应当善加任用。"

 jewish_ideas:3 "以色列理念"
 jewish_ideas_start:3 "以色列传统"
 jewish_ideas_bonus:3 "以色列雄心"
 end_of_diaspora:3 "流散终焉"
 end_of_diaspora_desc:3 "长久以来，以色列人散居于欧洲与中东各地，但如今我们有了自己的国家，这一切终于结束了！"
 national_myths_restored:3 "重塑民族神话"
 national_myths_restored_desc:3 "如今既已统一，我们便能再度回顾那些界定我们文化的神话，尤其是复兴我们的战士之王大卫，并以此磨砺我们的军队！"
 return_home:3 "归乡"
 return_home_desc:3 "既然犹太人如今有了可以称之为家的地方，许多人正迁回耶路撒冷，我们的经济与生产也随人口增长而蓬勃起来。"
 jewish_trade_tradition:3 "犹太贸易传统"
 jewish_trade_tradition_desc:3 "我们有着在世界各地经商的悠久传统，从上海到雷克雅未克。拉丹人便是这一可傲传统的典型例证。"
 jewish_banking:3 "犹太金融业"
 jewish_banking_desc:3 "犹太人在欧洲做债主已有很长时间，如今没有必要终止。我们应当在本国设立一家正规银行。"
 people_of_exile:3 "流亡之民"
 people_of_exile_desc:3 "由于历史缘故，我们更习惯于迁徙，因此我们的人民在新土地上定居颇为容易。"
 the_chosen_people:3 "上帝的选民"
 the_chosen_people_desc:3 "犹太人是上帝拣选的子民。凭他的圣意，我们绝不会再让以色列落入宿敌之手。"

 karling_ideas:3 "加洛林理念"
 karling_ideas_start:3 "加洛林传统"
 karling_ideas_bonus:3 "加洛林雄心"
 kings_of_europe:3 "欧洲诸王"
 kings_of_europe_desc:3 "加洛林家族常被称为欧洲之父，百余年间他们是西欧与中欧的统治者。"
 carolingian_grand_strategy:3 "加洛林大战略"
 carolingian_grand_strategy_desc:3 "查理曼与其父丕平以跨越数十年的谋略著称，正是他们造就了"大战略"一词。"
 military_obligations:3 "军事义务"
 military_obligations_desc:3 "查理曼对其境内的男子施加军事义务，尤其针对贵族。你越富有，就必须为国王的征战提供越多的兵员。"
 retinue_regnum_francorum:3 "法兰克王国的亲兵"
 retinue_regnum_francorum_desc:3 "查理曼的亲兵是法兰克的核心军队，是一支以罗马旧军事学派为基础、技艺精湛的职业化军队。"
 legacy_of_the_romans:3 "罗马人的遗产"
 legacy_of_the_romans_desc:3 "加洛林家族视自己为西罗马皇帝的合法继承者。"
 carolingian_renaissance:3 "加洛林文艺复兴"
 carolingian_renaissance_desc:3 "查理曼在位期间开启了一个被称为加洛林文艺复兴的时期，罗马帝国那些已死寂、被遗忘的思想与传统得以复兴。"
 tradition_of_war:3 "战争传统"
 tradition_of_war_desc:3 "加洛林家族以其宏大的征战与军事成就著称。这是一个在战火中锻造出的家族，其过往不易被遗忘。"

 #Redone in case of Bon Tibet
 vajrayana_buddhism:3 "信仰归一"
 vajrayana_buddhism_desc:3 "我们的人民在独特的世界观上团结一致。从最卑微的农奴到最高位的喇嘛，它都以熟悉而可预期的方式指引着我们的治理与日常生活。"
 way_of_virtue:3 "德之道"
 way_of_virtue_desc:3 "普世的慈悲是根本的精神取向。"
 potala_palace:3 "布达拉宫"
 potala_palace_desc:3 "布达拉宫于1645年在罗桑嘉措的主持下动工兴建。它高出拉萨河谷谷底千尺，基座石墙厚达十六尺，这座设防的宫殿占据着令人震撼的位置。在这座十三层的政府中枢内，有一千多个房间、一万座神龛与二十万尊造像。"
 way_of_ancients:3 "古之道"
 way_of_ancients_desc:3 "宁玛派，又称古译派，是西藏最古老的学派，融合了神秘主义以及佛教传入之前苯教所共有的地方神祇。在历史上，宁玛派在各学派中独树一帜：其支持者从未掌握政治权力，因此其修行者大多远离西藏的政治权谋，专注于苦行、独身与神秘修行。然而他们的存在为我们社会培养了纪律，并使我们始终与自身的根源相系。"
 pale_earth:3 "灰土派"
 pale_earth_desc:3 "灰土派，即萨迦派，其名源自日喀则附近藏南本波日山独特的灰色地貌，该传统的第一座寺院萨迦寺由昆·贡却杰布（1034—1102年）于1073年在此建成。萨迦传统由卓弥于11世纪晚期创立，他是一位曾在印度超戒寺求学的著名学者与译师。此派以好学与学术取向著称，其学院培养出西藏最富求知欲的头脑。"

## Holy Orders
 order_of_saint_addai_ideas:3 "圣阿代理念"
 order_of_saint_addai_ideas_start:3 "圣阿代传统"
 order_of_saint_addai_ideas_bonus:3 "圣阿代雄心"
 ZZZ_christians_of_the_east:3 "东方基督徒"
 ZZZ_christians_of_the_east_desc:3 "我们的人民长久以来在东方守护着基督之光。这绝非易事，因为我们常被当地的异教徒在人数上压过。然而我们已学会绕开这一难题，并尽可能减轻其影响。"
 ZZZ_kings_khans_emperors:3 "诸王、诸汗与诸皇的宫廷"
 ZZZ_kings_khans_emperors_desc:3 "我们的学者举世尊崇。多年来，我们的人民曾出入许多显贵者的殿堂，无论他们是伯爵、公爵、国王、汗还是皇帝。我们以最高的敬意待他们，他们也以礼相报。"
 ZZZ_fight_until_the_end:3 "战至最后"
 ZZZ_fight_until_the_end_desc:3 "我们的历史算不上幸福。我们的人民曾几乎被逼至灭绝的边缘，被抛散于四方，勉力维系。然而我们只从这场试炼中获得了力量。我们不会被摧毁，我们将一直战斗到最后一个男人、女人与孩子。"
 ZZZ_underdog_nestorians:3 "永远的弱者"
 ZZZ_underdog_nestorians_desc:3 "虽然我们以坚韧著称，但这并未必然转化为成功的名声。有些人或许会憎恶这种持续的轻视，但我们发现它其实颇为有用。依循寻常思路的外邦势力，竟往往会把我们取得的任何进展视作暂时的或侥幸的，从而予以忽视或轻慢。我们无意让他们改变看法——至少在我们把他们的土地据为己有之前。"
 ZZZ_military_opportunities:3 "军事机遇"
 ZZZ_military_opportunities_desc:3 "我们与东方和西方如此众多不同民族的往来，使我们积累了大量在多种环境下、以各种兵种作战的非凡经验。我们学会了保持选择的余地，并尽可能灵活应变。"
 ZZZ_all_for_the_struggle:3 "万众之奋斗"
 ZZZ_all_for_the_struggle_desc:3 "我们的国家奋斗时，我们的人民也在奋斗。保护人民是我们的责任，而支持我们同样是人民的责任。人民明白，一旦战事来临，他们必须自问能为国家做什么。"
 ZZZ_ideas_of_nations:3 "世界之术"
 ZZZ_ideas_of_nations_desc:3 "我们见过世间的奇观。从爱尔兰到契丹，我们见识过许多不同国家的技术，因而必须认识到绝不落于人后的重要性。我们必须始终探寻下一项事物、下一项能让我们超越同侪的进步。我们绝不能自满，以为已研究尽一切，因为宇宙及其奥秘是无穷的。"

 army_of_light_ideas:3 "光明理念"
 army_of_light_ideas_start:3 "光明传统"
 army_of_light_ideas_bonus:3 "光明雄心"
 ZZZ_ride_of_the_light_brigade:3 "光明骑手"
 ZZZ_ride_of_the_light_brigade_desc:3 "我们团体的许多新兵是草原游牧民的后裔，精通马术。正因有他们，我们才得以将骑兵打磨成世上最精锐者之一。我们的光明骑兵旅将冲入敌阵，把他们驱散如风中之尘！"
 ZZZ_inquisition_of_light:3 "光明裁判所"
 ZZZ_inquisition_of_light_desc:3 "本团体以遵行信仰的准则为荣。无论我们走到哪里，都随身带着光明的真理，以便与民众分享。然而有时，民众拒绝听从道理、拒绝拥抱光明。为应对此况，我们组建了一支特殊的裁判武力，其使命便是确保我们的臣民行走在光明之路上。"
 ZZZ_light_tithe:3 "光明什一税"
 ZZZ_light_tithe_desc:3 "我们每一位公民都有义务将部分收入捐给本团体，以便我们继续在世界的异教徒与异端之中传播光明。这项义务并非自愿。"
 ZZZ_light_always_shines:3 "不灭之光"
 ZZZ_light_always_shines_desc:3 "我们的团体永不倾覆。我们将始终把光明带给需要之人。我们永不畏缩，也绝不辜负我们的神圣职责。"
 ZZZ_message_of_light:3 "光明之讯"
 ZZZ_message_of_light_desc:3 "无论走到哪里，我们都传播光明之讯。我们的使节前往世上每一个国家，不辞辛劳地传播我们的讯息，颂扬本团体的美德。"
 ZZZ_into_the_fold_of_light:3 "光明之共同体"
 ZZZ_into_the_fold_of_light_desc:3 "我们将臣民视作自己的孩子——光明之子。我们平等相待，并以同样程度的管束对待所有人。"
 ZZZ_into_the_light:3 "步入火之光明"
 ZZZ_into_the_light_desc:3 "我们向光明行进。我们不退缩，也不迟疑。当枪口闪亮、空气因硝烟而浑浊，唯有枪火的闪光为我们照路时，我们把自己托付给光明，绝不转身。我们立于火之光明之中，穿行于混战，活着以待再战之日。"

 bektashi_order_ideas:3 "贝克塔什理念"
 bektashi_order_ideas_start:3 "贝克塔什传统"
 bektashi_order_ideas_bonus:3 "贝克塔什雄心"
 ZZZ_wahdat_al_wujud:3 "存在统一论"
 ZZZ_wahdat_al_wujud_desc:3 "我们信奉"瓦赫达特·乌朱德"，即「存在的统一」。世间万物既是祂，又非祂。存在是一切存在者那不可知、不可企及的根基。唯有真主是真正的存在，而万物居于非存在之中；同样，唯有存在不受限，其余一切皆受拘限。存在是真主那绝对、无限、不受限的实相，而其余一切都只是相对的、有限的、受限制的。"
 ZZZ_bektashi_graves_of_the_sanints:3 "圣徒之墓"
 ZZZ_bektashi_graves_of_the_sanints_desc:3 "维护并看护那些以其虔诚为世间增光的伊斯兰圣徒的墓地，是我们的神圣职责。许多人从伊斯兰世界各地前来，只为探访这些墓地并致以敬意。这带来了一项副作用：我们的贸易机会增多了。虽然我们绝不会堕落到利用圣徒牟利的地步，但也没有理由阻止这份天赐之利。"
 ZZZ_dervish_alms:3 "托钵僧施舍"
 ZZZ_dervish_alms_desc:3 "成为托钵僧者按例须立下守贫誓愿。他们把钱财给予需要之人，并在街头乞讨——不是为了自己，而是为了其他需要的人。作为本团体的核心部分，托钵僧带来了他们的苦行与谦卑。"
 ZZZ_bektashi_initiation:3 "纳西普"
 ZZZ_bektashi_initiation_desc:3 "要加入贝克塔什教派，须完成一项入教仪式（纳西普）。起初为"阿希克"，即表达了对教团兴趣但尚未入教者。完成纳西普之后，便成为"穆希普"，此后可进一步立誓成为托钵僧。再上一级是"巴巴"（父亲），有资格给予精神指导。巴巴之上是"哈里发-巴巴"或称"德德"（祖父）。传统上有12位德德，其中资历最深者称"德德巴巴"（曾祖父）。德德巴巴被视为贝克塔什教团中位阶最高的权威。"
 ZZZ_spiritual_outreach:3 "精神外展"
 ZZZ_spiritual_outreach_desc:3 "我们的道路要求我们与他人密切合作。事实上，通过吸纳他人所持的习俗与信仰，我们在使民众皈依我们的信仰方面取得了巨大成功。这也带来一项好处：我们在海外享有良好声望——因为尽管我们承诺在必要时为信仰而战，但事实证明，即便对信仰与我们大相径庭的民族，我们也通情达理、乐于合作。"
 ZZZ_bektashi_heterodoxy:3 "异端之说"
 ZZZ_bektashi_heterodoxy_desc:3 "我们并不局限于祖先的仪式与信仰。我们十分愿意采纳并适应地方传统与习俗。我们或许需要稍作调整，以确保它们不违背沙里亚法，但这种情况很少成为问题。"
 ZZZ_bektashi_need_for_speed:3 "迅捷护卫"
 ZZZ_bektashi_need_for_speed_desc:3 "有时，当我们的信仰遭受外力攻击时，我们不得不为其而战。此时，速度至关重要。每失去一刻，便又失去一片土地，又一位虔诚的信众遭到屠戮。从十字军东征至今，我们始终挺身应对保护族人的挑战。如今我们也不会被拦阻。"

 bulls_of_rishabha_ideas:3 "公牛理念"
 bulls_of_rishabha_ideas_start:3 "公牛传统"
 bulls_of_rishabha_ideas_bonus:3 "公牛雄心"
 ZZZ_jain_varna:3 "瓦尔那"
 ZZZ_jain_varna_desc:3 "正是第一位蒂尔坦卡拉瑞沙婆，在数百万年前依职业确立了瓦尔那社会阶层。瓦尔那阶层使我们的民众得以安全、幸福而满足，因为人人都知道自己在这世上的位置。无论种族、阶层或信条，人人皆有属于自己的瓦尔那，并都在其中行事——即便他们自以为并非如此。"
 ZZZ_jain_asi:3 "阿西"
 ZZZ_jain_asi_desc:3 "六大主要职业之首，阿西即兵戈之业。虽然我们厌恶杀害任何生灵，但我们承认，有时自卫是必要的。最精通此道者便从事阿西之术。"
 ZZZ_jain_masi:3 "马西"
 ZZZ_jain_masi_desc:3 "六大主要职业之二，马西即书写之术。本团体极为重视书写与识字，并致力于在我们掌控的土地上设立学校。读写带来和谐，并以别无他法的方式表达激情。思想与发明借此代代相传，不致湮没。马西或许是最为高贵的职业之一。"
 ZZZ_jain_krishi:3 "克里希"
 ZZZ_jain_krishi_desc:3 "六大主要职业之三，克里希即农耕之业。这一重要的职业竟常被其他民族所忽视，他们轻视那些辛勤劳作、为其提供生计的农夫。本团体却明白得更清楚：正是高贵的农夫为国家提供粮食，没有他，所有其他职业——无论何等显赫——都将不复存在。"
 ZZZ_jain_vidya:3 "维迪亚"
 ZZZ_jain_vidya_desc:3 "六大主要职业之四，维迪亚即知识。此世之上，少有事物比追求更多知识更为重要。知识的积累惠及所有人：新的农技帮助农夫，新的建造技术几乎惠及所有社群，数学与科学上的新发现推进我们对世界的理解。本团体大力鼓励对知识的高贵追求。"
 ZZZ_jain_vanijya:3 "瓦尼吉亚"
 ZZZ_jain_vanijya_desc:3 "六大主要职业之五，瓦尼吉亚即商贸。有人的地方，贸易便不可避免；而追求商贸正是本团体所鼓励的。成功且经营得当的贸易惠及各方，并促进众人之间的和睦。"
 ZZZ_jain_shilp:3 "希尔普"
 ZZZ_jain_shilp_desc:3 "六大主要职业之六，希尔普即工艺。从事希尔普的工匠为世间提供我们所需之物与所欲之物。裁缝为我们制作衣裳，鞋匠制造护足之鞋，雕刻家创作供众人观赏的艺术作品。本团体已使我们国家成为广为人知的艺术中心，因为我们认识到工匠对人类何其重要。"

 brotherhood_of_the_holy_sepulchre_ideas:3 "兄弟会理念"
 brotherhood_of_the_holy_sepulchre_ideas_start:3 "兄弟会传统"
 brotherhood_of_the_holy_sepulchre_ideas_bonus:3 "兄弟会雄心"
 ZZZ_the_brotherhood_long_game:3 "恢复有术"
 ZZZ_the_brotherhood_long_game_desc:3 "重要的不是我们总能取胜。世上没有任何力量，无论多么强大，能始终不败。重要的是被击倒后能够重新站起的能力。我们曾数次被击倒，却从未真正被击败。我们总能恢复，总能归来。"
 ZZZ_the_indefatiguable_brotherhood:3 "不倦的兄弟会"
 ZZZ_the_indefatiguable_brotherhood_desc:3 "自313年本团体创立以来，我们的使命一直是保护辖下的一切圣地。即便我们曾被迫逃离，我们也总是重返，随时准备再度担负起神圣职责。这世上没有任何力量能阻止我们完成使命。"
 ZZZ_legacy_of_the_byzantines:3 "拜占庭的遗产"
 ZZZ_legacy_of_the_byzantines_desc:3 "我们的历史与罗马帝国及其继承国拜占庭帝国密不可分。我们的历史中充满支持我们、为我们持续存续提供必需之物的皇帝。这段历史赋予我们国家一项悠久的传统，而它看来短期内不会终结。"
 ZZZ_brotherhood_conversion:3 "传教使命"
 ZZZ_brotherhood_conversion_desc:3 "自始至终，我们的任务便是将耶稣的讯息传播于世。我们从未停止，而只要本团体还有一名成员活着，我们就绝不会停止。"
 ZZZ_universal_brotherhood:3 "普世兄弟情谊"
 ZZZ_universal_brotherhood_desc:3 "你是谁并不重要，重要的是你做什么。将耶稣的光明带给大众是我们的方针，但我们从不认为强迫他人在宗教之外也改变生活方式是明智之举。我们力求拥有与主同样的普世之爱与理解。"
 ZZZ_caravans_of_the_brotherhood:3 "圣地商队"
 ZZZ_caravans_of_the_brotherhood_desc:3 "确保前往我们看护之圣地的朝圣者——他们常需经历危险的旅程——能够无所畏惧地成行，是我们的职责。尽管并非本意，这也使得我们为朝圣者守护的道路上，常有商队往来；他们十分乐意支付少量通行费以换取安全通行。而他们的钱又被用于保护更多朝圣路线。这套体系惠及所有相关方！"
 ZZZ_churches_of_the_holy_sepulchre:3 "宏伟营造"
 ZZZ_churches_of_the_holy_sepulchre_desc:3 "从宏伟的主教座堂到乡间的小教堂，我们都建造过。而后当它们被毁，我们又不得不重建。我们从未停止过建造、修缮与复原。我们国家有着宏伟营造的悠久历史，为何要让它停下？"

 chosen_of_ashoka_ideas:3 "阿育王理念"
 chosen_of_ashoka_ideas_start:3 "阿育王传统"
 chosen_of_ashoka_ideas_bonus:3 "阿育王雄心"
 ZZZ_major_edict_1:3 "大敕令一"
 ZZZ_major_edict_1_desc:3 "典礼过盛有悖于稳定而可持续的社会。因此，我们将恢复孔雀帝国禁止欢庆集会节日的古老敕令。此外，为与我们对自然的尊重相合，我们将在境内禁止一切动物献祭。这些举措合在一起，将有助于引领我们走向更稳定的社会。"
 ZZZ_major_edict_2:3 "大敕令二"
 ZZZ_major_edict_2_desc:3 "本团体尊崇阿育王与孔雀帝国的遗泽。我们近期恢复了孔雀帝国第二道大敕令，其中详定对病人与牲畜的强制照护、道路与树木的修建以及树木的栽植。本团体将为国家带来繁荣！"
 ZZZ_protectors_of_india:3 "坚定的守护者"
 ZZZ_protectors_of_india_desc:3 "本团体的神圣使命要求我们坚决对抗任何欲将死亡与毁灭带到我土地之上的人。我们必须坚定不移地守护此地，抵御一切意图加害者，无论代价为何。"
 ZZZ_major_edict_5:3 "大敕令五"
 ZZZ_major_edict_5_desc:3 "遵循阿育王的诸敕令，本团体已决定颁布我们自己的第五道大敕令，设立我们自己的"大官"，其职责便是传播我们的信仰。"
 ZZZ_major_edict_6:3 "大敕令六"
 ZZZ_major_edict_6_desc:3 "为确保国家顺畅运转，本团体已重新确立孔雀帝国的第六道大敕令。它确保帝国所推行的行政与商务举措得以迅速高效地完成。此外，大官们的任何奏报，只要被认为足够重要，便可直接呈交本团体之首。"
 ZZZ_major_edict_7:3 "大敕令七"
 ZZZ_major_edict_7_desc:3 "本团体已决定恢复阿育王治下伟大孔雀帝国的第七道大敕令。我们呼吁一切民族和睦相处，无论其教派或文化。"
 ZZZ_men_to_protect_india:3 "护卫无辜之人"
 ZZZ_men_to_protect_india_desc:3 "信仰中每一位体格健全的男子都有义务在需要之时挺身而出。本团体继续履行其保护无辜者的神圣职责；为做到这一点，我们从民众中招募那些明白自身职责的人。"

 children_of_dralha_ideas:3 "德拉拉之子理念"
 children_of_dralha_ideas_start:3 "德拉拉之子传统"
 children_of_dralha_ideas_bonus:3 "德拉拉之子雄心"
 ZZZ_defend_the_motherland:3 "保卫家园"
 ZZZ_defend_the_motherland_desc:3 "本团体负有神圣职责，须保护家园免受外敌侵犯，无论个人代价为何。我们将加强防务，绝不放任何一个敌人通过。"
 ZZZ_resist_the_invader:3 "抵抗入侵者"
 ZZZ_resist_the_invader_desc:3 "当敌人来犯时——那是"何时"而非"是否"——我们必须有所准备。我们国家的每一位公民都必须准备好为我们的志业拼死而战。本团体绝不会停止捍卫正与义，我们永不倾覆。"
 ZZZ_bon_prayer:3 "祈祷"
 ZZZ_bon_prayer_desc:3 "祈祷是我们信仰中三个最重要的方面之一。本团体的成员必须将生命的大部分奉献于祈祷，我们也鼓励公民如此行。祈祷净化灵魂，并唤起人身上最好的部分。"
 ZZZ_bon_diligence:3 "勤勉"
 ZZZ_bon_diligence_desc:3 "勤勉是我们信仰中三个最重要的方面之一。本团体极为重视勤勉，并确保表现勤勉者得以晋升。虽然勤勉只对本团体成员具有强制性，但事实证明我们是公民的良好榜样，他们仰望着我们。如今他们也重视勤勉，并因此获得了惊人的生产效率。他国领袖只能艳羡地看着我国公民的勤勉。"
 ZZZ_bon_devotion:3 "虔诚"
 ZZZ_bon_devotion_desc:3 "虔诚是我们信仰中三个最重要的方面之一。本团体特别强调虔诚，并期望团体的每一位成员都真正献身于团体与信仰。"
 ZZZ_bon_temple_castles:3 "设防寺院"
 ZZZ_bon_temple_castles_desc:3 "本团体早已认识到，把寺院与防御工事分开是相当愚蠢的想法。寺院没有理由既不能设防以抵御入侵者，又不能同时是一处宁静的祈祷之所。因此我们的寺院不仅实用，还宏大而精巧，为众人所艳羡。这种双重用途也有助于降低成本，因为我们只需建造并维护一处建筑。"
 ZZZ_monk_and_leader:3 "武僧"
 ZZZ_monk_and_leader_desc:3 "本团体主要由武僧构成——他们既立下僧侣誓愿，也持续为战斗而修习。这些人善于领导，精通神学、哲学与战略。要引领我们的国家走向伟大，我们再也找不到比这更好的人选储备了。"

 cult_of_huitzilopochtli_ideas:3 "维齐洛波奇特利理念"
 cult_of_huitzilopochtli_ideas_start:3 "维齐洛波奇特利传统"
 cult_of_huitzilopochtli_ideas_bonus:3 "维齐洛波奇特利雄心"
 ZZZ_legacy_of_flowers:3 "花战的遗产"
 ZZZ_legacy_of_flowers_desc:3 "从前，我们的人民发动战争，唯一目的便是俘获敌人以献祭诸神。这些待献祭者必须被活捉，这意味着我们的士兵须有极高的克制，否则便有触怒诸神之虞。我们的崇拜已把这份克制化作重要的一课。我们的每一名成员都严守纪律，无论命令何等艰难，都能遵从。"
 ZZZ_will_of_the_gods:3 "诸神的意志"
 ZZZ_will_of_the_gods_desc:3 "诸神的意志是让我们持续扩张。若要诸神欢喜，我们就必须以祭品的血供养他们。如今我们知道，不必像先前所认为的那样频繁供养，但必须以敌人的血来供养。要取得敌人的血，我们就必须开战，以武力夺取——他们当然不会主动献上自己。"
 ZZZ_permanent_godly_expansion:3 "诸神的授命"
 ZZZ_permanent_godly_expansion_desc:3 "诸神已授命我们继续向异教徒扩张。我们知晓诸神的真理，很快其他人也会知晓。"
 ZZZ_content_gods:3 "餍足的诸神"
 ZZZ_content_gods_desc:3 "我们的献祭使诸神欢喜并站在我们一边。我们的战士愉快地作战，因为他们知道诸神将赐予他们所求的胜利。"
 ZZZ_from_across_the_sea:3 "来自海的彼岸"
 ZZZ_from_across_the_sea_desc:3 "我们并非源自这片土地。海那边的皇帝派我们来到此地，为诸神征服它。我们取得了惊人的成功，本团体在征服这些原始民族的过程中出力甚巨。然而我们从未忘记自己的传承，至今仍建造能够完成漫长而危险的归乡之旅的船只。"
 ZZZ_take_to_the_seas_again:3 "再度出海"
 ZZZ_take_to_the_seas_again_desc:3 "我们的祖先从远方来到这片海岸，以满足那些要求征服的诸神的渴求。如今，当我们在其他远方发现新的土地时，那召唤再度响起。现在，我们再度被召向船只，启程前往新的土地。"
 ZZZ_aztec_trade_home:3 "跨大西洋贸易"
 ZZZ_aztec_trade_home_desc:3 "作为诸神意志的体现，我们的崇拜位于纳瓦世界的边缘。但我们从未与故土失去联系，而与他们之间的贸易，已证明是我们在欧洲、非洲与亚洲这个"新世界"中持续成功的关键。"

 chosen_of_perkunas_ideas:3 "选民理念"
 chosen_of_perkunas_ideas_start:3 "选民传统"
 chosen_of_perkunas_ideas_bonus:3 "选民雄心"
 ZZZ_defenders_of_the_old_ways:3 "古道守护者"
 ZZZ_defenders_of_the_old_ways_desc:3 "确保外邦势力永不夺取任何属于信众的土地，是我们的神圣职责。我们必须坚强挺立，绝不畏缩，保护我们的人民，并在敌人摧毁我们之前先摧毁他们。"
 ZZZ_guard_the_coasts:3 "守卫海岸"
 ZZZ_guard_the_coasts_desc:3 "本团体的使命并不限于我们所持的土地，也包括我们的海岸。世上所有的城墙都挡不住一支意志坚定的海军。唯一的解决之道是一道木墙——由我们自己的船只组成。"
 ZZZ_builders_of_perkunas:3 "佩尔库纳斯的建造者"
 ZZZ_builders_of_perkunas_desc:3 "我们的人民有着悠久的营造历史。诚然，其中大多是为了抵御外敌，但本团体明白，这些技艺可以转用于其他事业。宏伟的神庙、大型的贸易市场、城堡——这一切乃至更多，都可以用数百年积累的技艺来建造。"
 ZZZ_never_surrender:3 "选民"
 ZZZ_never_surrender_desc:3 "我们的人民已被诸神拣选，以持守古道。本团体不辞辛劳地确保这一使命得以完成。即便敌人能暂时将我们逼退，我们也绝不会停止战斗，以夺回属于我们的一切！"
 ZZZ_stop_foreign_spies:3 "紧密的社群"
 ZZZ_stop_foreign_spies_desc:3 "本团体与我们的臣民都以紧密团结而著称。即便在大城镇中，多数人也彼此相识。陌生人无论我们的语言说得多么流利，都会被立刻认出。这种紧密也大幅降低了背叛的可能，因为任何异常举动都会迅速被察觉。这使我们国家极难被渗透，而渗透本团体则更是难上加难。"
 ZZZ_the_chosen:3 "佩尔库纳斯的选民"
 ZZZ_the_chosen_desc:3 "本团体的名号并非徒具虚表。我们的成员都曾受佩尔库纳斯亲自召唤，每一位成员都准备好在需要之时为他而死。我们就是那永远守护信仰与道路的选民。"
 ZZZ_keep_out_the_invaders:3 "先发防御"
 ZZZ_keep_out_the_invaders_desc:3 "我们的国家被敌人所嫉视。本团体昼夜不息地保卫我们的土地与人民，抵御那些邻邦的贪婪之手。历经诸多试炼，我们已精通先发制人之术。敌人若在来得及行动之前便已死去，便无法作战。我们的领袖已成为这些初始交锋的大师，确保国家持续安全。"

 followers_of_arjuna_ideas:3 "阿周那理念"
 followers_of_arjuna_ideas_start:3 "阿周那传统"
 followers_of_arjuna_ideas_bonus:3 "阿周那雄心"
 ZZZ_dhananjaya:3 "檀那阇耶"
 ZZZ_dhananjaya_desc:3 "檀那阇耶，意为「带来财富者」，是阿周那众多尊号之一。本团体力求媲美他的伟大，因此我们努力缔造一个繁荣而治理良好的国家。"
 ZZZ_jishnu:3 "吉什努"
 ZZZ_jishnu_desc:3 "吉什努，意为「凯旋者」，是阿周那众多尊号之一。本团体虽无阿周那那般完美的战绩，但我们力求多半能凯旋而归。"
 ZZZ_truth_of_arjuna:3 "本来如此"
 ZZZ_truth_of_arjuna_desc:3 "我们在这宇宙中的位置，在出生的那一刻便已注定；人的职责便是接受这份命运，并努力完成自己生来应当承担的角色。"
 ZZZ_indian_trade:3 "印度贸易"
 ZZZ_indian_trade_desc:3 "我国生产的货物为世界各国所艳羡。本团体已察觉到这份需求，并鼓励本地商人前往海外，以吸引更多贸易。有了更多钱财，我们就能做更多的事！"
 ZZZ_grand_temples:3 "宏伟神庙"
 ZZZ_grand_temples_desc:3 "作为军事团体，我们的职责之一便是守护本信仰的神圣庙宇。然而，我们守护旧庙，并不意味着我们不承认有新庙的需要。凭借新技术，我们如今能够建造更大、更宏伟的庙宇。这也会给我们的建造者带来可用于其他营造工程的经验。"
 ZZZ_cheap_gurus:3 "苦行僧与上师"
 ZZZ_cheap_gurus_desc:3 "本团体作为该信仰的典范，自然吸引了众多博学的苦行僧与上师。这些男女不仅资质出众，所索取的报酬也微不足道。"
 ZZZ_vijaya:3 "毗阇耶"
 ZZZ_vijaya_desc:3 "毗阇耶，意为「无敌者」，是阿周那众多尊号之一。我们的士兵单个并非无敌，但作为一个团体，我们可以协力配得上阿周那的称号。团结起来，我们将无敌！"

 knights_of_the_sun_ideas:3 "祖恩骑士理念"
 knights_of_the_sun_ideas_start:3 "祖恩骑士传统"
 knights_of_the_sun_ideas_bonus:3 "祖恩骑士雄心"
 ZZZ_all_shall_praise_the_sun:3 "众生皆当赞美太阳"
 ZZZ_all_shall_praise_the_sun_desc:3 "赞美太阳！"
 ZZZ_the_sword_of_zun:3 "祖恩之剑"
 ZZZ_the_sword_of_zun_desc:3 "本团体是祖恩之剑。我们将他的正义施于他的敌人，并坚定地保护他的人民。"
 ZZZ_zun_the_lawgiver:3 "立法者祖恩"
 ZZZ_zun_the_lawgiver_desc:3 "人间一切真正的律法都自祖恩传予我们。本团体服从祖恩的谕令，依他的律法、在他的律法之下施行治理。"
 ZZZ_zun_the_bringer_of_light:3 "祖恩，光明的带来者"
 ZZZ_zun_the_bringer_of_light_desc:3 "祖恩为世界提供光明。他以光明带来生命，也带来死亡。本团体对此真理有着不言而喻的理解并欣然接受。我们的骑士帮助需要之人，带来生命；但若有人愚妄到敢于反对祖恩的真理，我们的骑士同样会迅疾地带来死亡。"
 ZZZ_greatness_of_zun:3 "祖恩的荣耀"
 ZZZ_greatness_of_zun_desc:3 "祖恩的荣耀使一切试图凝视他的人都目眩。他的荣耀将永存，而我们作为他忠实的仆人，将把他的荣耀带向世界。"
 ZZZ_fire_of_zun:3 "祖恩的火焰"
 ZZZ_fire_of_zun_desc:3 "时代已变，我们的骑士不再以剑、盾与矛为祖恩的荣耀而战。如今我们使用枪与炮。凭借火——祖恩亲自赐予的礼物——的力量，我们依循神圣使命，用这些武器将异端与异教徒从世上涤除。"
 ZZZ_fire_of_zun_naval:3 "将祖恩的火焰带向海洋"
 ZZZ_fire_of_zun_naval_desc:3 "我们传播祖恩之光明的使命，不可能也不会被区区海水所阻！我们将带着枪炮同行，让世上的异教徒在海上也如陆上一般见识祖恩的光明。"

 haruriyyah_ideas:3 "哈鲁里耶理念"
 haruriyyah_ideas_start:3 "哈鲁里耶传统"
 haruriyyah_ideas_bonus:3 "哈鲁里耶雄心"
 ZZZ_legacy_of_oman:3 "海洋的遗产"
 ZZZ_legacy_of_oman_desc:3 "我们的人民有着海上强权的历史。即便我们无法在陆上挑战敌人，我们也总能在海上挑战他们。我们从未忘记那段历史，也绝不会忘记我们的海军！"
 ZZZ_for_the_faithful:3 "为信士"
 ZZZ_for_the_faithful_desc:3 "我们是《古兰经》真正的追随者。正是我们的祖先明白其真义，并拒绝了阿里与穆阿维叶之间的仲裁。穆阿维叶是骗子、是伪哈里发，而阿里在同意违背《古兰经》文句的仲裁时便放弃了自己的主张。唯有我们坚守了真正的信仰。我们必须利用自身的地位，让世上其他国家明白这一道理。"
 ZZZ_converting_the_other:3 "除真主外别无审判者"
 ZZZ_converting_the_other_desc:3 "我们对反对我们的人严厉，但这并不意味着我们是无情的暴君。我们明白，他人自幼便被谎言所欺。要摆脱这些谎言并非易事，或许需要数年，但我们的使命绝不会停止，直到每一个异教徒与异端都看见光明。"
 ZZZ_nomadic_traditions:3 "游牧民的遗产"
 ZZZ_nomadic_traditions_desc:3 "与大多数穆斯林一样，我们的历史始于一群以游牧为主的民族。虽然我们早已放弃这种生活方式，却未曾忘记所学的教训。我们的人民精通马与骆驼，并曾以此大败敌人。我们将继续尊崇祖先，延续我们对鞍马的娴熟。"
 ZZZ_bring_the_big_guns:3 "大型野战炮"
 ZZZ_bring_the_big_guns_desc:3 "从历史上看，我们的人数并不总是很多。因此我们不得不学会以少应对。如今随着火炮的出现，我们再度看到了以少应对的办法：因为在我们面前死去之前的敌人，便是无法杀死我们战友的敌人。"
 ZZZ_use_ships_to_trade_and_propagate:3 "不惜代价的贸易与传教"
 ZZZ_use_ships_to_trade_and_propagate_desc:3 "我们的海上帝国已开始延伸得相当遥远。我们遇到了越来越多甚至从未听说过穆罕默德的民族。我们的传教士常与商人同行，努力传播他的言语。我们必须加倍努力，同时推广我们的贸易与宗教。我们几乎肯定会在此过程中遭受损失，但我们不能因此却步！"
 ZZZ_the_true_followers:3 "真正的道路"
 ZZZ_the_true_followers_desc:3 "有许多人不明白真正的道路。这无妨，因为我们明白，且永不忘记。我们唯一效忠的是《古兰经》与穆罕默德的圣行。太多人把自己系于血统之类的东西，或系于真伪可疑的著述。我们信赖《古兰经》以及已被证明为真者。唯有我们认出了那将带来救赎的真正信仰。"

 immortals_ideas:3 "不朽者理念"
 immortals_ideas_start:3 "不朽者传统"
 immortals_ideas_bonus:3 "不朽者雄心"
 ZZZ_era_of_conversion:3 "持续皈化"
 ZZZ_era_of_conversion_desc:3 "本团体致力于纠正我们先人的错误。我们绝不会再如此懈怠，以致不向大众传播琐罗亚斯德的讯息。我们必须把他的话传给一切愿意聆听者，从我们自己的人民开始。绝不再让某个来自穷乡僻壤的先知威胁我们的生活方式！"
 ZZZ_immortal_diaspora:3 "不辍的流散之利"
 ZZZ_immortal_diaspora_desc:3 "当我们的祖先被逐出家园、流落远方时，他们随身带着自己的信仰。即便数百年后的今天，他们仍未失去信仰。尽管身处异乡为异客，我们许多失散的同胞已跻身富商或重要官员之列。我们可以运用这些关系，以最大化与同胞所居地区的贸易。"
 ZZZ_expand_the_immortal_ranks:3 "无尽的行列"
 ZZZ_expand_the_immortal_ranks_desc:3 "虽然我们不再像从前那样把人数严格限定为一万人，但我们或许已拒绝了太多有意加入本团体的新兵。凡愿加入我们行列者，至少都应获得证明自身价值的机会。行列中人数更多，我们就永不倾覆——因为每一名倒下的人都将立刻由另一人接替！我们永恒、不朽、无可避免。"
 ZZZ_expand_the_rites:3 "永续的典礼"
 ZZZ_expand_the_rites_desc:3 "我们已相当擅长说服他人至少听一听我们的传道者。然而本团体传播宗教的速度却未如我们所想。经检讨，我们认定只需稍作资源重新调配，便可让入教典礼在全国各地举行，而不必一次只专注于一个地区。"
 ZZZ_immortal_sameness:3 "不朽的一致"
 ZZZ_immortal_sameness_desc:3 "本团体不仅在其成员之间，也在其人民之间，重视一致与同一。我们必须竭尽全力将我们的传统带给臣民，让他们看到我们的传统何其优越。"
 ZZZ_the_eternal_fires:3 "永恒之火"
 ZZZ_the_eternal_fires_desc:3 "本团体守护着琐罗亚斯德的若干永恒之火，已安然保存数百年。"
 ZZZ_the_whites_of_their_eyes:3 "无尽的进军"
 ZZZ_the_whites_of_their_eyes_desc:3 "我们的士兵明白自己的职责。士兵在战争中死去，这无可避免。当一名士兵倒下，你便默默无争地接替他的位置。指挥体系将始终清晰而不断，直至最后一名普通士兵。本团体在敌人的火力中一路前行，直到能看清他们的眼睛。那时——也只有那时——我们才会在抵近的距离上开火。"

 knights_of_calatrava_ideas:3 "卡拉特拉瓦理念"
 knights_of_calatrava_ideas_start:3 "卡拉特拉瓦传统"
 knights_of_calatrava_ideas_bonus:3 "卡拉特拉瓦雄心"
 ZZZ_calatravan_vows:3 "熙笃会规习"
 ZZZ_calatravan_vows_desc:3 "除三项宗教誓愿之外，本团体还维持着更为严格的规条。团体全体成员在食堂、寝室与祈祷室中必须保持静默；除一年中若干斋日外，每周须守斋四日；每诵念日课各时辰须念固定数目的主祷文；须着甲而眠；须以熙笃会的白色斗篷配猩红百合十字纹章作为正装。"
 ZZZ_calatravan_royal_intrigue:3 "王室权谋"
 ZZZ_calatravan_royal_intrigue_desc:3 "我们的权势与影响并未逃过世上权贵家族的眼睛。许多人试图挤入我们的行列，并安插我们的领袖。这种对我们自主权的不断侵夺，反倒使我们相当擅长保护自己免受他人算计。"
 ZZZ_calatravan_papal_favour:3 "教宗的恩眷"
 ZZZ_calatravan_papal_favour_desc:3 "本团体长久以来与教宗保持着良好关系。他认可我们的神圣职责，并支持这项职责以及我们本身。"
 ZZZ_calatravan_aggression:3 "收复失地运动的遗产"
 ZZZ_calatravan_aggression_desc:3 "在将摩尔人逐出伊比利亚半岛这一长期目标中，本团体一直是根本性的一环。别人不愿据守的堡垒由我们据守，别人不敢发起的突击由我们的军队带头。我们的武力曾是欧洲最庞大、最强悍者之一，而我们未曾忘记。"
 ZZZ_calatravan_rule:3 "好基督徒的治理"
 ZZZ_calatravan_rule_desc:3 "有些人压榨其农民，以求榨取最多。然而我们以温和之手与对贫者的虔敬关怀，生产力却远超那些盘剥成性的暴君。我们已证明并昭示：上帝必赏赐善待其臣民者。"
 ZZZ_light_to_heathens:3 "带来基督之光"
 ZZZ_light_to_heathens_desc:3 "当我们向敌人进军时，并非出于对他们的憎恨，而是出于对上帝的爱。无论我们走到哪里，传播他的讯息、并尽可能传播得更远，都是我们的职责。"
 ZZZ_the_tireless_calatravans:3 "不知疲倦"
 ZZZ_the_tireless_calatravans_desc:3 "本团体多年来一直维持着自身的纪律，胜过许多已消失或屈服于世俗压力的其他团体。而本团体记得自己的根源，我们绝不退让，也绝不投降。"

 knights_of_santiago_ideas:3 "圣地亚哥理念"
 knights_of_santiago_ideas_start:3 "圣地亚哥传统"
 knights_of_santiago_ideas_bonus:3 "圣地亚哥雄心"
 ZZZ_cross_of_st_james:3 "无瑕之誉"
 ZZZ_cross_of_st_james_desc:3 "我们力求彰显圣徒的美德，本团体也以其服饰纹章展现这份虔敬。我们的旗帜与披风上带有基督十字，三朵鸢尾花则代表圣雅各"无瑕之誉"的品格。"
 ZZZ_canons_of_augustine:3 "圣奥古斯丁会规"
 ZZZ_canons_of_augustine_desc:3 "与许多其他军事修会不同，我们不遵行西多会本笃派的严苛规条，而是遵循较为温和的圣奥古斯丁会规。这使我们兼具两种角色：既是医护修士，也是军事修会的骑士。我们保护前往圣徒圣地的朝圣者，同时也协助经营许多济贫院。这一点，加上我们拥有结婚的权利，为我们赢得了温和待人、公平待众的卓著名声。"
 ZZZ_galleys_of_santiago:3 "圣地亚哥的桨帆船"
 ZZZ_galleys_of_santiago_desc:3 "我们的使命常需要我们出海。然而许多人未必愿意自愿从事海上服役。因此我们定下规条：凡有志加入本团体者，至少须在本团体的桨帆船上服役六个月。这不仅解决了我们的水手不足问题，也为我们储备了一批经验丰富的桨帆船船员，以备不时之需。"
 ZZZ_santiago_encomienda:3 "骑士的委托领地"
 ZZZ_santiago_encomienda_desc:3 "为支应本团体的需要，我们的每一位骑士统领都获授一处"恩科米恩达"——即其产业的行政与经济中心。通过各自的恩科米恩达，骑士统领得以征收税赋、通行费与什一税的收入。每位骑士统领都有责任为自己、其麾下骑士以及一支征召矛兵装备武器，以备团体需要他时调用。"
 ZZZ_nobility_of_santiago:3 "贵族修会"
 ZZZ_nobility_of_santiago_desc:3 "从历史上看，加入圣地亚哥骑士团相对容易，但13世纪中叶之后变得更为困难。有意加入者必须在其最近四代家世中证明：他本人、其父母与祖父母皆为血统上的贵族，而非因特权而贵，且从未从事手工或工业劳作。有志加入者还不得是犹太人、穆斯林、异端或皈依基督教者的后裔——无论相隔多少代。随着时间推移，国王与骑士团理事会废除了其中许多要求。"
 ZZZ_santiago_bullarium:3 "圣地亚哥教令集"
 ZZZ_santiago_bullarium_desc:3 "自我们创立以来，教宗便认为应当授予本团体许多恩惠。我们的成员从一开始就被允许结婚，我们也很快获得了其他修会所享有的一切特权与豁免。"
 ZZZ_santiago_true_calling:3 "我们真正的召唤"
 ZZZ_santiago_true_calling_desc:3 "我们确实是一个军事修会，也确实在必要时作战。然而这只是我们职责中最次要的一项；远为重要的是照料病人、帮助贫者，以及将耶稣的讯息传向世界。必要时我们以剑作战，但我们更愿以言语作战。"

 lords_of_the_sky_ideas:3 "天空之主理念"
 lords_of_the_sky_ideas_start:3 "天空之主传统"
 lords_of_the_sky_ideas_bonus:3 "天空之主雄心"
 ZZZ_shock_and_awe:3 "震慑"
 ZZZ_shock_and_awe_desc:3 "当我们冲入敌阵时，没有一名敌兵不盼着自己身在世上任何别处。我们打击沉重、行动迅捷，绝不手软。众生都将在我们的威势前颤抖！"
 ZZZ_lords_of_the_caravan:3 "商队之主"
 ZZZ_lords_of_the_caravan_desc:3 "商队靠其役畜之力运行。而我们恰好拥有世上最好的马匹，数百年来精心培育，以最大化其力量与耐力。这使我们国家成为许多商队与有意经商者必到之地。"
 ZZZ_horse_lords:3 "马之主"
 ZZZ_horse_lords_desc:3 "本团体诞生于草原，我们从未忘记自己的来源。团体的成员几乎生活在马背上，没有一名成员不能在马上开弓或挥剑。我们的骑兵为世上每一个国家所理应畏惧，因为我们承袭前人的谋略，并将其提炼为完美的艺术。"
 ZZZ_the_sprawling_sky:3 "绵延的天空"
 ZZZ_the_sprawling_sky_desc:3 "我们或许只是一个军事团体，但我们的国家已开始变得如天空般辽阔。所幸我们惯于处理此类难题。重新调配我们的行政力量，以在不过度扩张的前提下最大化控制，对我们而言无需费太多力气。"
 ZZZ_or_else:3 "拒绝的代价"
 ZZZ_or_else_desc:3 "若敌人接受我们宽大的和平条件，我们将以最高的礼数相待。一个善战、并在显然已败时投降的敌人，是值得尊重的。然而，若有人犯下拒绝我们条件的错误，我们将确保那位统治者及其国家为此后悔。本团体绝不容忍那种不知自己何时已败的蠢人。他们若不放下刀剑，我们便替他们放下——最好是穿过他们的身体。"
 ZZZ_lords_abroad:3 "贸易之主"
 ZZZ_lords_abroad_desc:3 "虽然我们国家以无可匹敌的马匹储备最为著名，但那绝非我国所能提供的唯一之物。随着越来越多的国家认识到这一点，对我方货物的需求也随之增长。这为全国各地的商人与创业者创造了巨大机会。甚至我们团体的一些成员也参与其中！"
 ZZZ_modern_cavalry:3 "近代骑兵"
 ZZZ_modern_cavalry_desc:3 "时代变迁，我们不容自己落后。除却最特殊的军事用途之外，枪已取代了弓。有悲观者预言骑兵的末日，但我们明白得更清楚。需要做的，是让骑兵近代化，使其不在这场军备竞赛中落后。正如我们先祖学会了在马背上用弓的技艺，我们同样将精通在马背上用枪的技艺！"

 myrmidons_ideas:3 "米尔弥冬理念"
 myrmidons_ideas_start:3 "米尔弥冬传统"
 myrmidons_ideas_bonus:3 "米尔弥冬雄心"
 ZZZ_legacy_of_the_legions:3 "军团兵的遗产"
 ZZZ_legacy_of_the_legions_desc:3 "罗马军团彻底改变了战争的方式。本团体的名字取自阿基里斯的勇敢部队，但我们的组织与纪律则取自罗马军团。"
 ZZZ_hellenic_exceptionalism:3 "希腊思想"
 ZZZ_hellenic_exceptionalism_desc:3 "说罗马人与希腊人缔造了西方文明，绝非夸张。这一文明立足于罗马与希腊伟大思想家的肩背之上：从苏格拉底到奥维德，古代的伟大人物都教导人必须始终让心智保持开放。本团体认真对待这一教诲，并乐于接纳新思想。"
 ZZZ_mare_nostrum:3 "我们的海"
 ZZZ_mare_nostrum_desc:3 "本团体不能被局限于陆地。如同布匿战争时期的罗马人，我们也必须走向海洋，并在那里建立我们的主导地位。"
 ZZZ_myrmidon_taxes:3 "高效的税收"
 ZZZ_myrmidon_taxes_desc:3 "每一个国家都靠其公民的税赋运转。我们或许是一个军事团体，但这条格言对我们而言与对任何其他国家一样成立。我们运用前人的教训，建立起一套令邻邦艳羡的极为高效的税收体制。"
 ZZZ_myrmidon_ranks:3 "米尔弥冬改革"
 ZZZ_myrmidon_ranks_desc:3 "在检视本团体的武力之后，我们发现由于标准有误、招募人员训练不佳，我们一直错失了大量有潜力的新兵。基于这些发现，我们已重整军制，以更好地利用我们的处境来充实行伍。"
 ZZZ_myrmidon_building:3 "希腊的荣耀"
 ZZZ_myrmidon_building_desc:3 "希腊人建造了令世界艳羡的宏伟神庙与雕像。罗马人在其整个帝国范围内修筑道路，并完成了今日几乎难以想象的营造工程。作为那段历史的守护者，本团体已将尽可能延续希腊与罗马的营造与发展传统列为优先事项。"
 ZZZ_legacy_of_alexander:3 "亚历山大的遗产"
 ZZZ_legacy_of_alexander_desc:3 "谈及历史上的伟大人物时，若不提亚历山大大帝便是一大疏漏。他摧毁了一切挡在他面前者，缔造了一个直到罗马人出现之前都无可匹敌的庞大帝国。本团体自豪地延续他扩张的传统，随身带去文明！"

 order_of_saint_anthony_ideas:3 "圣安东尼理念"
 order_of_saint_anthony_ideas_start:3 "圣安东尼传统"
 order_of_saint_anthony_ideas_bonus:3 "圣安东尼雄心"
 ZZZ_coptic_defenders:3 "科普特守护者"
 ZZZ_coptic_defenders_desc:3 "数百年来，本团体一直是抵御穆斯林侵入的堡垒。即便与北方的兄弟姐妹隔绝，也唯有我们守护着我们人民的信仰。我们独自坚强挺立，也将继续独自坚强挺立。"
 ZZZ_go_far_copts:3 "海外声望"
 ZZZ_go_far_copts_desc:3 "关于我们事迹的传闻，即便在离我们极为遥远的土地上也已化作传说。当我们的商人外出时，总会被拉到一旁，被追问他们听来的事是否属实。这使对我方商人的需求增加了。即便最初的原因只是想听我们的故事，我们优良的货物也必定足以成为留下我们商人的充分理由。"
 ZZZ_order_in_every_town:3 "每镇设一分会"
 ZZZ_order_in_every_town_desc:3 "我们不止是一个修会，更是一个治理着众多民族的国家。这需要与地方当局合作，并将我们的成员分散到全国各地。通过在每个城镇设立分会，我们不仅能更好地治理人民，还能带来维持如此之多分会所需的招募人数。"
 ZZZ_mission_to_the_unknown:3 "前往未知之地"
 ZZZ_mission_to_the_unknown_desc:3 "圣安东尼本人以走入荒野、踏入未知而著称。他冒着足以令许多寻常人丧命的环境。我们已竭尽全力尊崇他的遗泽，本团体也始终高度推崇苦修。然而我们是一个团体，有使命要完成。我们不能就这样消失在荒野之中；不，我们必须走入未知，以传播上帝的讯息。我们将走入未知，并在那里把福音带给尚未听闻的人。"
 ZZZ_capacity_for_more:3 "充实行伍"
 ZZZ_capacity_for_more_desc:3 "作为军事团体，我们必须有能力保护我们虔诚的兄弟姐妹。若没有足够的士兵来保护他们并击退敌人，我们便无法做到这一点。我们必须重整武力、审核预算，以便为那些愿加入我们、保卫团体及其受托之人者创造更多机会。"
 ZZZ_coptic_gold:3 "黄金的经验"
 ZZZ_coptic_gold_desc:3 "本团体幸得一段与黄金有关的历史。数百年来，本团体经手——有时甚至开采——这种众人渴求的金属。然而我们自身对它的用途极为基本。作为苦修团体，我们不沉溺于奢华与过剩。正因如此，我们比许多其他国家更懂得如何控制黄金与其他贵重物品的流动。我们有克制，而克制带来更好的经济。"
 ZZZ_order_in_the_ranks:3 "行伍中的秩序"
 ZZZ_order_in_the_ranks_desc:3 "我们的国家已变得庞大而强盛，尤其考虑到我们是一个修道团体。我们的人数已膨胀，招募情况再好不过，但我们不能容许这股新兵涌入毁掉我们的纪律。我们必须确保全国各地的训练项目都维持严格的标准与操典。我们承受不起被敌人打个措手不及的代价！"

 spirit_guardians_ideas:3 "神灵守护者理念"
 spirit_guardians_ideas_start:3 "神灵守护者传统"
 spirit_guardians_ideas_bonus:3 "神灵守护者雄心"
 ZZZ_guardians_of_the_people:3 "人民之守护者"
 ZZZ_guardians_of_the_people_desc:3 "本团体的成立是为了守护三样东西：我们的传统、我们的生活方式以及我们的人民。最后一项往往最为重要，因为我们必须坚决抵抗那些意图改变我们传统与生活方式、并屠杀我们人民的外敌。因此，我们的职责就是成为抵御一切外邦势力的坚固壁垒。我们不会回避敌人，我们将正面迎战。"
 ZZZ_guardians_of_trade:3 "贸易之守护者"
 ZZZ_guardians_of_trade_desc:3 "我们的守护职责并不限于本团体所守护的陵墓与圣地。我们也有责任保护一切不带恶意进入我们土地的人，包括朝圣者、商人与旅人。我们向这些人提供保护，确保他们的安全与生计。而这同时提升了我们整体的贸易潜力，不过是附带效应而已。"
 ZZZ_guardians_of_spirit:3 "神灵守护者"
 ZZZ_guardians_of_spirit_desc:3 "我们对圣地与祖先墓葬的守护永不松懈。我们自身的精神已在本团体严苛的入团仪式中受过考验，每一位成员都心志坚定。我们接受同袍可能在履行职责时殒命，但我们依然坚强，因为知道他们的灵魂将壮大我们的灵魂，赐予我们胜利。"
 ZZZ_guardians_of_the_arts:3 "艺术之守护者"
 ZZZ_guardians_of_the_arts_desc:3 "本团体认识到艺术在维系地方习俗与传统方面的重要性。正因这份认识，我们团体中许多人已成为著名的艺术家、雕塑家与建筑师。我们将永远是艺术的赞助者，即便对象是他国之人。一切富有创造力的心智都欢迎来访本团体。"
 ZZZ_guardians_of_industry:3 "实业之守护者"
 ZZZ_guardians_of_industry_desc:3 "有些人会攻击新兴的行业与技术，讥之为多余且有违地方传统。然而本团体明白，变化是任何文化不可或缺的一部分，拒绝变化乃是停滞而非伟大。要紧的是守住传统的精髓，而非永远一成不变。因此我们鼓励人民尝试新事物，并向不同门类拓展。"
 ZZZ_guardians_of_the_seas:3 "海洋之守护者"
 ZZZ_guardians_of_the_seas_desc:3 "既然我们力求不惜代价保护我们的人民，就不能忘记辽阔的海洋。我们的人民乘船前往全球各地。同样，人们也因种种缘由乘船来到我们国家。我们不能容许这些人遭受海盗的暴行或外邦的干涉。我们应当走向海洋，以延续我们的守护使命！"
 ZZZ_guardians_of_all:3 "众生之守护者"
 ZZZ_guardians_of_all_desc:3 "本团体的神圣职责始终是做人民的守护者。随着世界演进、我们扩张，我们逐渐认识到我们的使命也需要扩展。奴隶制这一度近乎无伤大雅的习俗，如今已成了最可怖之事。临时奴役的时代早已远去，近代世界中的奴隶遭受的是终身奴役，且会传给他们的子女。作为一个团体，我们不能再容忍这一习俗。奴隶制必须终结，本团体必须承认一切民族——无论其出身——的尊严。"

 sons_of_kaleva_ideas:3 "卡勒瓦理念"
 sons_of_kaleva_ideas_start:3 "卡勒瓦传统"
 sons_of_kaleva_ideas_bonus:3 "卡勒瓦-佩伦雄心"
 ZZZ_large_order:3 "庞大的团体"
 ZZZ_large_order_desc:3 "我们是一个军事团体。这本身并不稀奇，稀奇的是我们掌控的土地之多。本团体不仅须遵守誓愿，还须治理我们掌控的广袤土地。诚然，并非全部土地都有人居住，但与定居点之间的距离本身就是一项挑战。所幸我们已发展出一套高效的土地管理体系。"
 ZZZ_kalevan_trade:3 "贸易导向"
 ZZZ_kalevan_trade_desc:3 "本团体未必处在事情的中心，但我们的位置出人意料地关键：商人若要前往世界其他地方，便不得不经过我们。因此，本团体对贸易流向有着出人意料的影响力。"
 ZZZ_cannon_hunters:3 "从弓到炮"
 ZZZ_cannon_hunters_desc:3 "懂得如何有效使用弓是一门困难的技艺，需要仔细瞄准，并考虑箭矢下坠与风速等因素。火炮也是如此，只是更大、更快、更好。随着我国以枪炮走向近代化，我们过去在弓上的专长已开始真正派上用场。"
 ZZZ_convert_the_masses:3 "皈化大众"
 ZZZ_convert_the_masses_desc:3 "这未必是我们最重要的优先事项，但使异教徒与异端臣民皈依，仍应是我们作为一个团体所关注的事。通过训练更多成员精通神学论辩，我们应当能够扩大使臣民皈依真信的努力。"
 ZZZ_vast_peoples:3 "众族云集"
 ZZZ_vast_peoples_desc:3 "本团体广袤的领地使我们得以接触到众多信仰与生活方式各异的人。此外，只要他们愿意遵行并持守我们的誓愿，本团体便乐于接纳这些人。这使我们国家得以接触到大量人才，需要时便可从中挑选。"
 ZZZ_kalevan_expansion:3 "向未知扩张"
 ZZZ_kalevan_expansion_desc:3 "我们将信仰传播给一切接触之人的使命，不会仅因某个地区未经探索或充满蛮族就停止。把真理带到这些地区是我们的职责，无论危险为何。"
 ZZZ_take_down_the_walls:3 "拆毁这些城墙"
 ZZZ_take_down_the_walls_desc:3 "我们国家一直在重型火炮上投入甚巨，而这对我国而言成效极佳。随着本团体扩张，我们发现大多数国家尚未认识到火炮在战斗或围城中的全部潜力。对他们而言不幸的是，我们已经认识到了。"

 warriors_of_perun_ideas:3 "佩伦理念"
 warriors_of_perun_ideas_start:3 "佩伦传统"
 warriors_of_perun_ideas_bonus:3 "佩伦雄心"
 ZZZ_best_warriors:3 "真正的战士"
 ZZZ_best_warriors_desc:3 "本团体明白什么才真正造就一名战士。我们不被许多其他国家所持的错误观念所束缚；我们的战士被普遍公认为世上最精锐，而我们知道原因所在。我们将确保这一点保持不变。"
 ZZZ_warriors_of_unity:3 "团结的战士"
 ZZZ_warriors_of_conversion:3 "战士祭司"
 ZZZ_warriors_of_conversion_desc:3 "本团体的成员不只是单纯的士兵。每一位成员都必须精通我们的神学，并准备好不仅以流血之战、也以言辞之战来捍卫信仰。"
 ZZZ_warriors_of_unity:3 "团结的战士"
 ZZZ_warriors_of_unity_desc:3 "团结之中有力量，这一点本团体深有体会。一支箭容易被折断，一束箭却几乎无法折断。我们同立，我们同倒。"
 ZZZ_warriors_read_books:3 "博学的战士"
 ZZZ_warriors_read_books_desc:3 "本团体坚信：不读书的战士是失败的战士。战士必须始终力求完善自身，不仅体魄上，也在心智上。我们已将鼓励国内知识传承列为优先事项。"
 ZZZ_seasonal_warriors:3 "应时的战士"
 ZZZ_seasonal_warriors_desc:3 "我们信仰的节令与历法极为重要，本团体的每一位成员都必须知道何时该做何事。这不止于必须遵行的宗教节日与庆典：每一位战士都须选择一门行业并加以操习。为此，时机至关重要——农夫须在不同时节栽种不同作物，商人须为特定季节作准备，畜牧者须知道每种牲畜何时发情。"
 ZZZ_one_nation:3 "顺从的战士"
 ZZZ_one_nation_desc:3 "我们是一个不可分割的国家。本团体重视一致，我们将把它带给人民。人人都应遵行合宜的仪式，所有人都应遵循神圣历法为他们定下的日程！无论你离国家中心有多远，你仍是这个国家的一部分。"
 ZZZ_warriors_in_unison:3 "齐心的战士"
 ZZZ_warriors_in_unison_desc:3 "本团体绝非乌合之众，我们是世上组织最严密、纪律最严明的武力之一！任何想要面对我军威势的对手都必须准备好战至最后，因为我们的战士时刻准备着。"

 zealots_ideas:3 "狂热者理念"
 zealots_ideas_start:3 "狂热者传统"
 zealots_ideas_bonus:3 "狂热者雄心"
 ZZZ_free_from_invaders:3 "抵抗入侵者"
 ZZZ_free_from_invaders_desc:3 "我们从未、也绝不会容忍入侵者。我们将守护我们的土地直到最后一个孩子，每一个犹太人都有责任竭尽全力摧毁任何企图占据理应属于我们之物的人。"
 ZZZ_our_own_zealot_destiny:3 "我们自己的命运"
 ZZZ_our_own_zealot_destiny_desc:3 "太久以来，我们的人民被迫为他人的利益而劳作。更糟的是，他们还因成功而遭受迫害。而我们相反，将酬报人民付出的辛劳；成功再不会以背信相报！"
 ZZZ_zealot_revolts:3 "狂热者起义"
 ZZZ_zealot_revolts_desc:3 "我们知道被外力统治、并仅仅因为我们的身份而遭受迫害是何滋味。我们不能容许这种事发生在任何其他民族身上！所幸我们对起义略知一二，并且十分乐于把这门知识分享给受压迫的邻人。"
 ZZZ_protect_the_coasts:3 "保护我们的海岸"
 ZZZ_protect_the_coasts_desc:3 "我们的神圣职责是保护犹太人免受外敌侵犯，以确保再不会有另一次流散。若我们无法保护海岸免受来自海上的入侵者，便无法做到这一点。我们必须走向海洋，摧毁那些企图登上我们神圣土地的人！"
 ZZZ_jewish_foreign_contacts:3 "国外关系"
 ZZZ_jewish_foreign_contacts_desc:3 "在世上许多宫廷中，你都会发现犹太人常为国家处理重要事务。所幸我们认识他们的亲属，必要时能与他们及其雇主取得联系。这使我们拥有一支令人印象深刻的外交队伍——尽管严格说来，他们往往并不居住在我国境内！"
 ZZZ_zealot_purity:3 "志业的纯洁"
 ZZZ_zealot_purity_desc:3 "我们承受不起让道德与传统受到损害的代价。无论外敌向我们投来什么，我们都将始终致力于与其抗争！我们承受不起让软弱的领袖继续掌权的代价；他们要么端正自身，要么就发现自己被免职。"
 ZZZ_zealot_commerce:3 "谨慎的通商"
 ZZZ_zealot_commerce_desc:3 "当我们与外国通商、并聚敛本国财富时，必须谨慎，不让局面失控。我们国内有许多家族过去从事过银行业，因此我们深知通胀与糟糕经济的风险。我们将竭尽所能避免任何需要我们增发货币的局面，反而会不辞辛劳地确保通胀尽可能低。"

#Fraticelli Pope
 FAP_ideas:3 "小兄弟派理念"
 FAP_ideas_start:3 "小兄弟派传统"
 FAP_ideas_bonus:3 "小兄弟派雄心"
 ZZZ_little_brethren:3 "小兄弟们"
 ZZZ_little_brethren_desc:3 "我们遵循亚西西的圣方济各的教诲，严守守贫誓愿，并帮助一切需要帮助的人。这份坚守在别国之间孕育出信任与接纳。"
 ZZZ_true_christians:3 "真基督徒"
 ZZZ_true_christians_desc:3 "在教会得到净化之前，它曾长期陷于罪中，充斥着无意义的奢华与贪婪。我们使教会回归本源，并专注于真正要紧之事。"
 ZZZ_defenders_of_the_faith:3 "捍卫信仰"
 ZZZ_defenders_of_the_faith_desc:3 "我们原则上回避暴力，更倾向于外交。然而我们的邻邦并不总是抱持同样的信念，我们即便不愿，也曾被迫卷入战争。不过，当我们被迫作战时，我们是在全然明白主与我们同在的情况下战斗的。"
 ZZZ_beauty_in_simplicity:3 "简朴"
 ZZZ_beauty_in_simplicity_desc:3 "我们不把时间浪费在耸入云霄的庞大建筑上，也不为陶器、彩绘玻璃或挂毯支付奢靡的巨款。礼拜之所是为敬拜主的伟大，而非教会的伟大。我们的建筑实用而廉价，我们无需向任何人炫耀。"
 ZZZ_love_thy_neighbor:3 "爱你的邻人"
 ZZZ_love_thy_neighbor:3 "主命令我们彼此相爱。我们不应把时间浪费在争论哪种生活方式最好上。只要人们以全部心意、全部灵魂爱主，他们如何度过日常生活便无关紧要。"
 ZZZ_a_loving_hand:3 "仁爱之手"
 ZZZ_a_loving_hand_desc:3 "我们尽可能善待臣民，只让他们缴纳其力所能及的部分。他国或许以难以置信的眼光看我们，然而我们似乎从未有过他国那样的叛乱与问题。或许这些满腹狐疑的统治者可以多向万王之王学习，少听他们那些贪婪的财政官。"
 ZZZ_spread_the_word:3 "传播福音"
 ZZZ_spread_the_word_desc:3 "将主的言语传播于世是我们的神圣职责。在全世界都知晓他的荣耀与慈悲之前，我们永不歇息。一切能被拯救者，都必须得到拯救！"

#Assyrian Empire

 ASY_ideas:0 "亚述理念"
 ASY_ideas_start:0 "亚述传统"
 ASY_ideas_bonus:0 "亚述雄心"
 ZZZ_assyrian_bowmen:0 "亚述弓手"
 ZZZ_assyrian_bowmen_desc:0 "亚述弓手自古闻名，长久以来被外邦占领者的军团所用，如今他们为自己的家园而战"
 ZZZ_forced_resttlement:0 "强制迁徙"
 ZZZ_forced_resttlement_desc:0 "为防止反抗我们统治的叛乱，我们应当以祖先为鉴，强迫被征服的敌人迁居于我们王国各地"
 ZZZ_banks_of_tigris:0 "两河之地"
 ZZZ_banks_of_tigris_desc:0 "界定我们这片土地的伟大河流——底格里斯河与幼发拉底河——长久以来被忽视。让我们重建我们先祖开创的宏大灌溉系统，为所有人带来财富"
 ZZZ_learn_from_babylon:0 "以巴比伦为鉴"
 ZZZ_learn_from_babylon_desc:0 "虽然拥有附属国是外交上的必要，但尼尼微在我们名义上的臣属手中陷落一事，绝不可被遗忘"
 ZZZ_rebuild_the_cities:0 "重建城市"
 ZZZ_rebuild_the_cities_desc:0 "为证明我们并非过去的遗物，使我们的古老城市近代化并得以复兴至关重要——尼尼微、巴比伦与阿淑尔都必须再度从灰烬中崛起"
 ZZZ_restore_the_library_of_nineveh:0 "重建尼尼微图书馆"
 ZZZ_restore_the_library_of_nineveh_desc:0 "我们的传承不仅关乎战争，也关乎文学与高雅艺术。让我们把这一切都取回，并复原一切被劫掠与窃取之物"
 ZZZ_nineveh_falls_no_more:0 "四隅重光"
 ZZZ_nineveh_falls_no_more_desc:0 "在古代，美索不达米亚被认为由四个边角所界定，其内便是整个文明世界。虽然在我们缺席之时外面的世界已有所发展，但我们在此重建的一切弥足珍贵，我们绝不会再度倾覆。"


# In English, we use Anatolian as a Greek culture, but in the game, Anatolian Ideas are for generic Turkish culture countries.
 anatolian_beyliks_ideas:3 "土耳其理念"
 anatolian_beyliks_ideas_start:3 "土耳其传统"
 anatolian_beyliks_ideas_bonus:3 "土耳其雄心"
